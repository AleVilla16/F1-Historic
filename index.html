<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 History</title>
<meta name="description" content="Storico completo dei risultati di Formula 1 dal 1950 a oggi">
<meta name="theme-color" content="#171a21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1 History">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
/*
VOICE: archivio tecnico da box F1, preciso e veloce.
IDEA: il tabellone dei tempi in pit wall: righe fitte, numeri allineati, rosso solo dove conta.
PICTURE: le tabelle stesse sono il contenuto; podio oro/argento/bronzo nelle celle.
COLOUR and TYPE: carbonio scuro, rosso F1 #e10600 come accento; Titillium Web.
LAYOUT: barra superiore con menu, contenuto a tutta larghezza, tabelle con colonne fisse.
*/
:root{--bg:#0f1115;--bg2:#171a21;--bg3:#1f232c;--line:#2a2f3a;--ink:#eef0f4;--mut:#8f97a8;--red:#e10600;--red2:#ff3b30;
--gold:#d4a017;--silver:#a9b0bb;--bronze:#b8733d;--green:#2fb37a;--blue:#4a8fe7;--purple:#9b6bd6;--rowodd:#13161c;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f7;--bg2:#ffffff;--bg3:#eceef2;--line:#d9dce3;--ink:#15171c;--mut:#5d6575;--rowodd:#f8f9fb;color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:50;padding-top:max(6px,env(safe-area-inset-top))!important;padding-left:max(14px,env(safe-area-inset-left))!important;padding-right:max(14px,env(safe-area-inset-right))!important;background:var(--bg2);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:6px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:.2px;text-decoration:none;white-space:nowrap}
.brand b{background:var(--red);color:#fff;padding:0 7px;border-radius:3px;font-style:italic}
.topgap{flex:1}
.menubtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);padding:0;flex:none}
.menubtn:hover,.menubtn[aria-expanded=true]{border-color:var(--red);color:var(--red2)}
nav.menu{display:none;position:fixed;inset:0;z-index:300;flex-direction:column;overflow:auto;
 padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 background:radial-gradient(120% 60% at 50% 0%,rgba(225,6,0,.28),transparent 60%),radial-gradient(80% 50% at 100% 100%,rgba(225,6,0,.12),transparent 70%),linear-gradient(180deg,#15151e,#0b0b10);
 animation:navin .22s ease-out}
nav.menu.open{display:flex}
nav.menu::before{content:'';position:fixed;left:0;right:0;bottom:0;height:14px;opacity:.18;pointer-events:none;
 background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/14px 14px}
@keyframes navin{from{opacity:0}to{opacity:1}}
@keyframes navitem{from{opacity:0;transform:translateY(10px) skewX(-8deg)}to{opacity:1;transform:skewX(-8deg)}}
.navtop{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;margin-bottom:6px;position:relative}
.navtop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--red) 20%,var(--red) 80%,transparent)}
.navtop .brand{font-size:21px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px}
.navx{font-size:20px;background:rgba(255,255,255,.06)}
.navlist{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;max-width:520px;margin:auto;padding:18px 0}
body.navopen{overflow:hidden}
nav.menu a{position:relative;display:block;text-align:center;padding:10px 18px;text-decoration:none;color:#f2f2f5;
 font-family:'Titillium Web',system-ui,sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:1.6px;font-size:21px;line-height:1.15;
 transform:skewX(-8deg);border-left:4px solid transparent;border-right:4px solid transparent;border-radius:4px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);
 transition:background .15s,color .15s,border-color .15s;animation:navitem .3s ease-out both}
nav.menu a:hover{background:linear-gradient(90deg,transparent,rgba(225,6,0,.25),transparent);border-left-color:var(--red);border-right-color:var(--red)}
nav.menu a.on{color:#fff;background:linear-gradient(90deg,#9e0400,var(--red) 30%,var(--red) 70%,#9e0400);border-color:#fff;box-shadow:0 6px 22px rgba(225,6,0,.35)}
nav.menu a.sep{margin-top:10px}
nav.menu a:nth-child(1){animation-delay:0.025s}
nav.menu a:nth-child(2){animation-delay:0.050s}
nav.menu a:nth-child(3){animation-delay:0.075s}
nav.menu a:nth-child(4){animation-delay:0.100s}
nav.menu a:nth-child(5){animation-delay:0.125s}
nav.menu a:nth-child(6){animation-delay:0.150s}
nav.menu a:nth-child(7){animation-delay:0.175s}
nav.menu a:nth-child(8){animation-delay:0.200s}
nav.menu a:nth-child(9){animation-delay:0.225s}
nav.menu a:nth-child(10){animation-delay:0.250s}
nav.menu a:nth-child(11){animation-delay:0.275s}
nav.menu a:nth-child(12){animation-delay:0.300s}
.syncchip{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.syncchip .bar{width:90px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.syncchip .bar i{display:block;height:100%;background:var(--red);width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.run{background:var(--red);animation:pulse 1s infinite}.dot.err{background:#f5a623}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot.run{animation:none}}
@media(max-width:600px){.syncchip span:not(.dot):not(.bar){display:none}}
main{padding:14px max(clamp(10px,2vw,24px),env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(clamp(10px,2vw,24px),env(safe-area-inset-left))}
@media(display-mode:standalone){body{overscroll-behavior-y:none}}
h1{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:4px 0 12px}
h2{font-size:20px;margin:18px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.mut{color:var(--mut)}.small{font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px}
input[type=search],input[type=text],input[type=url],input[type=number],select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;min-height:38px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{text-decoration:none;display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;min-height:28px;font-size:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.scroll{overflow:auto;max-width:100%}
table.t{border-collapse:separate;border-spacing:0;font-size:14px;width:max-content;min-width:100%}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
table.t th{background:var(--bg3);position:sticky;top:0;z-index:2;font-weight:700;font-size:13px}
table.t tbody tr:nth-child(even) td{background:var(--rowodd)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t .fz{position:sticky;left:0;z-index:1;background:var(--bg2)}
table.t th.fz{z-index:3;background:var(--bg3)}
table.t td.team{border-left:4px solid var(--red);font-weight:700;vertical-align:top;background:var(--bg2)!important}
.lk{cursor:pointer;text-decoration:none;font-weight:600}
.lk:hover{color:var(--red2);text-decoration:underline}
/* celle risultato */
.r{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 3px;font-weight:600;font-variant-numeric:tabular-nums}
.r1{background:var(--gold);color:#111}.r2{background:var(--silver);color:#111}.r3{background:var(--bronze);color:#111}
.rp{background:color-mix(in srgb,var(--green) 30%,transparent)}.rf{background:color-mix(in srgb,var(--blue) 22%,transparent)}
.rr{background:color-mix(in srgb,var(--purple) 30%,transparent)}.rq{color:var(--mut)}.rd{background:#222;color:#fff}
sup.m{font-size:9px;margin-left:1px;font-weight:700}
.champ{color:var(--gold);font-weight:700}
/* griglia virtuale */
.vg{position:relative;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.vg-head{position:sticky;top:0;z-index:5}
.vg-hr{display:flex}
.vg-h{flex:none;background:var(--bg3);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 6px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;text-align:center}
.vg-h.fz{position:sticky;z-index:6;text-align:left}
.vg-h.grp{font-size:14px;text-align:left;padding-left:10px;background:var(--bg2);border-right:2px solid var(--red)}
.vg-h.s-asc::after{content:' ▲';color:var(--red2)}.vg-h.s-desc::after{content:' ▼';color:var(--red2)}
.vg-body{position:relative}
.vg-r{position:absolute;left:0;display:flex;width:100%}
.vg-r.odd .vg-c{background:var(--rowodd)}
.vg-r:hover .vg-c{background:var(--bg3)}
.vg-c{flex:none;padding:0 6px;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 50%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--bg2);font-size:13.5px}
.vg-c.fz{position:sticky;z-index:2;justify-content:flex-start}
.vg-c.l{justify-content:flex-start}
.vg-c.ye,.vg-h.ye{border-right:2px solid var(--red)}
.z{color:color-mix(in srgb,var(--mut) 60%,transparent)}
/* anno */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.years a{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none}
.years a:hover{border-color:var(--red)}
.years b{font-size:22px;display:block;line-height:1.1}
.years span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;background:var(--bg3);color:var(--mut)}
.tag.title{background:var(--gold);color:#111}.tag.win{background:var(--red);color:#fff}.tag.team{background:var(--blue);color:#fff}.tag.pole{background:var(--purple);color:#fff}.tag.pod{background:var(--bronze);color:#111}.tag.rec{background:var(--green);color:#111}
/* modale */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;max-width:1100px;width:100%;padding:16px 18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;font-size:26px;background:none;border:0;cursor:pointer;color:var(--mut);width:44px;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--bg3);border-radius:8px;padding:6px 10px;text-align:center;min-width:70px}
.chip b{display:block;font-size:20px;line-height:1.1}.chip span{font-size:11px;color:var(--mut)}
.banner{background:color-mix(in srgb,var(--red) 14%,var(--bg2));border:1px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.prog{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--red)}
.era{border-left:4px solid var(--red)}
.era ul{margin:6px 0 0;padding-left:20px}
.diff-up{color:var(--green);font-weight:700}.diff-dn{color:var(--red2);font-weight:700}
tr.changed td{background:color-mix(in srgb,var(--gold) 14%,transparent)!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){table.t{font-size:13px}main{padding:10px 8px}}

.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.yb{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:8px 4px;font-weight:700;cursor:pointer;min-height:44px;font-variant-numeric:tabular-nums}
.yb i{position:absolute;top:2px;right:5px;font-style:normal;font-size:11px}
.yb.ok{border-color:var(--green)}.yb.ok i{color:var(--green)}
.yb.partial{border-color:#f5a623}.yb.partial i{color:#f5a623}
.yb.missing{color:var(--mut)}
.yb.queued{border-style:dashed;border-color:var(--red)}
.yb.run{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
.yb:hover{border-color:var(--ink)}
.ylegend{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ys{display:inline-block;width:22px;text-align:center;border:1px solid var(--line);border-radius:5px;font-weight:700}
.ys.ok{border-color:var(--green);color:var(--green)}.ys.partial{border-color:#f5a623;color:#f5a623}.ys.queued{border:1px dashed var(--red)}
.years a.nodata{opacity:.6;border-style:dashed}
@media(prefers-reduced-motion:reduce){.yb.run{animation:none}}
.yb.alt{outline:2px dashed var(--blue);outline-offset:-4px}
.nat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(127,127,127,.35);flex:none}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px}
.jc{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px}
.jn{display:inline-flex;align-items:center;gap:6px;font-weight:700;width:100%}
.jc a{color:var(--mut);text-decoration:none}.jc a:hover{color:var(--red2);text-decoration:underline}
.ch{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.ccard{display:flex;flex-direction:column;gap:2px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;text-decoration:none}
.ccard:hover{border-color:var(--red)}
.ccard b{font-size:16px}.cy{font-size:12px;color:var(--red2);font-weight:700}
.cw{margin-top:6px;font-size:13px}
.chead h1{display:flex;align-items:center;gap:10px;margin:4px 0}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.stat span{grid-column:1/3;font-size:12px;color:var(--mut)}
.stat b{font-size:15px}.stat i{font-style:normal;font-size:24px;font-weight:700;color:var(--red2)}
.tc{display:inline-block;width:4px;height:14px;border-radius:2px;margin-right:6px;vertical-align:-2px;flex:none}
.colist{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto}
.colrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--line)}
.colrow label{display:flex;gap:8px;align-items:center;cursor:pointer}
.colrow span{display:flex;gap:4px}.colrow .btn{min-width:36px}
.mapcard{padding:10px}
.worldmap{position:relative}
.worldmap svg{display:block;width:100%;height:auto;max-height:52vh;border-radius:8px;transition:none}
.worldmap .sea{fill:color-mix(in srgb,var(--blue) 10%,var(--bg))}
.worldmap .land{fill:color-mix(in srgb,var(--ink) 16%,var(--bg2));stroke:color-mix(in srgb,var(--ink) 25%,transparent);stroke-width:.4;fill-rule:evenodd}
.worldmap #grat line{stroke:color-mix(in srgb,var(--ink) 8%,transparent);stroke-width:.5}
.worldmap .dot circle{fill:var(--red);stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.worldmap .dot:hover circle{fill:var(--gold)}
.worldmap .dot.off circle{fill:var(--mut);opacity:.35}
.mapnote{position:absolute;left:8px;bottom:6px}
.conts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.contbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer;min-height:44px}
.contbtn:hover{border-color:var(--mut)}.contbtn.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--bg3))}
.cflags{display:flex;gap:3px}
@media(max-width:600px){.conts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.homehead{text-align:center}.homehead h1{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:760px;margin:18px auto 0}
.pstep{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.pinfo{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px 10px}
.pname{font-size:17px;line-height:1.2}.p1 .pname{font-size:20px}
.pteam{font-size:13px;color:var(--mut);display:flex;align-items:center}.ptime{font-size:13px;font-variant-numeric:tabular-nums}
.pblock{background:var(--bg3);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:10px 10px 0 0;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.p1 .pblock{height:150px;color:var(--gold)}.p2 .pblock{height:110px;color:var(--silver)}.p3 .pblock{height:80px;color:var(--bronze)}
@media(max-width:600px){.pname{font-size:14px}.p1 .pname{font-size:16px}.p1 .pblock{height:110px}.p2 .pblock{height:80px}.p3 .pblock{height:60px}.pblock{font-size:26px}}
@media(max-width:600px){.top{flex-wrap:nowrap}#newdata{font-size:12px;padding:4px 7px;white-space:normal;line-height:1.1;max-width:120px}}
.ev .tag{flex:none}
.tag.pen{background:#f5a623;color:#111}.tag.inc{background:#c0392b;color:#fff}.tag.td{background:#7f8c8d;color:#fff}.tag.rain{background:#3498db;color:#fff}.tag.delay{background:#8e44ad;color:#fff}.tag.flg{background:#d4a017;color:#111}.tag.other{background:var(--bg3)}
.evform{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.av{border-radius:50%;object-fit:cover;flex:none;margin-right:6px;vertical-align:middle;background:var(--bg3);box-shadow:0 0 0 1px var(--line)}
.avi{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pinfo .av{margin:0 0 4px}

/* ================= TEMA "PIT WALL" v2.6 ================= */
:root{--bg:#0c0d12;--bg2:#15171f;--bg3:#1e212b;--line:#2a2e3a;--rowodd:#12141b;--card:linear-gradient(180deg,#191c25 0%,#13151c 100%);--glow:0 10px 30px rgba(0,0,0,.35);--disp:'Titillium Web',system-ui,sans-serif}
:root[data-theme=light]{--card:linear-gradient(180deg,#ffffff 0%,#f7f8fa 100%);--glow:0 6px 20px rgba(20,22,30,.08)}
body{background:radial-gradient(1200px 500px at 50% -180px,rgba(225,6,0,.16),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
:root[data-theme=light] body{background:radial-gradient(1200px 500px at 50% -200px,rgba(225,6,0,.08),transparent 70%),var(--bg)}
/* barra superiore */
.top{background:color-mix(in srgb,var(--bg2) 82%,transparent)!important;-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:0!important;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.25)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--red) 15%,var(--red2) 50%,var(--red) 85%,transparent)}
.brand{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.6px}
.brand b{padding:1px 8px;border-radius:3px;transform:skewX(-8deg);display:inline-block;box-shadow:0 4px 14px rgba(225,6,0,.45)}
.menubtn{border-radius:10px;background:color-mix(in srgb,var(--bg3) 80%,transparent);transition:border-color .15s,color .15s,transform .15s}
.menubtn:active{transform:scale(.95)}
/* titoli */
h1{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
main>h1::before{content:'';width:8px;height:.95em;background:linear-gradient(180deg,var(--red2),var(--red));transform:skewX(-14deg);border-radius:2px;flex:none;box-shadow:0 0 14px rgba(225,6,0,.5)}
.homehead h1::before{display:none}
h2{font-family:var(--disp);font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.6px;font-size:18px;display:flex;align-items:center;gap:9px}
h2::before{content:'';width:18px;height:3px;background:var(--red);transform:skewX(-20deg);flex:none}
.card h2::before,.modal h2::before,.box h2::before{display:none}
h3{font-weight:700}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.04)}
details.card>summary{cursor:pointer;font-weight:700}
/* pulsanti */
.btn{border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 100%,#fff 4%),var(--bg3));transition:border-color .15s,transform .1s,box-shadow .15s,background .15s;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.btn:hover{border-color:color-mix(in srgb,var(--red) 55%,var(--line));box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#ff2a1f,var(--red));border-color:#ff2a1f;box-shadow:0 6px 18px rgba(225,6,0,.35);font-weight:700;letter-spacing:.2px}
.btn.pri:hover{box-shadow:0 8px 24px rgba(225,6,0,.5)}
.btn[disabled]{opacity:.55;cursor:default}
/* campi */
input[type=search],input[type=text],input[type=url],input[type=number],select{background:color-mix(in srgb,var(--bg) 60%,var(--bg2));border-radius:9px;transition:border-color .15s,box-shadow .15s}
input[type=search]:focus,input[type=text]:focus,input[type=url]:focus,input[type=number]:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,6,0,.18);outline:none}
input[type=checkbox]{accent-color:var(--red)}
/* schede (tab) */
.tabs{border-bottom:0;gap:6px;padding:4px;background:color-mix(in srgb,var(--bg2) 80%,transparent);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow:auto;flex-wrap:nowrap}
.tabs button{border:0;border-radius:8px;padding:8px 14px;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink);background:var(--bg3)}
.tabs button.on{color:#fff;background:linear-gradient(180deg,#ff2a1f,var(--red));box-shadow:0 4px 14px rgba(225,6,0,.35)}
/* tabelle e griglie */
.vg{border-radius:12px;box-shadow:var(--glow);background:var(--bg2)}
.vg-h{background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 100%,#fff 3%),var(--bg3));font-size:12px;color:color-mix(in srgb,var(--ink) 85%,var(--mut))}
.vg-h.grp{font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:13px;color:var(--ink);background:var(--bg2)}
.vg-r:hover .vg-c{background:color-mix(in srgb,var(--red) 9%,var(--bg3))}
.vg-c{font-variant-numeric:tabular-nums}
table.t{border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{text-transform:uppercase;letter-spacing:.4px;font-size:11px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 100%,#fff 3%),var(--bg3))}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--red) 8%,var(--bg3))}
.r{border-radius:5px}
.r1{background:linear-gradient(180deg,#f0c43a,#c8960f)}.r2{background:linear-gradient(180deg,#d3d8df,#9aa1ac)}.r3{background:linear-gradient(180deg,#d38c52,#a5602c)}
/* annate */
.years{gap:10px}
.years a{position:relative;overflow:hidden;background:var(--card);border-radius:12px;padding:12px 14px;transition:transform .15s,border-color .15s,box-shadow .15s}
.years a::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);transform:scaleY(0);transition:transform .2s}
.years a:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.years a:hover::before{transform:scaleY(1)}
.years b{font-family:var(--disp);font-weight:900;font-style:italic;font-size:26px}
.years a.nodata{opacity:.55}
/* tag eventi */
.tag{border-radius:5px;transform:skewX(-8deg);display:inline-block;letter-spacing:.3px;text-transform:uppercase;font-size:10px;padding:2px 8px}
.ev{padding:5px 6px;border-radius:8px}
.ev:hover{background:color-mix(in srgb,var(--bg3) 60%,transparent)}
/* modale */
.modal{background:rgba(5,6,10,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{border-radius:16px;border-top:0;box-shadow:0 24px 60px rgba(0,0,0,.55);background:var(--card),var(--bg2);overflow:hidden}
.modal .box::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--red),var(--red2),var(--red))}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:10px}
.chip b{font-family:var(--disp);font-weight:900;font-style:italic}
.banner{border-radius:12px}
/* home */
.homehead .cy{font-weight:700;letter-spacing:1px;text-transform:uppercase}
.homehead h1{font-size:clamp(26px,4vw,40px)}
.pblock{background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 100%,#fff 4%),var(--bg2));font-family:var(--disp);font-weight:900;font-style:italic;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.pstep.p1 .pblock{border-top-color:var(--gold);box-shadow:0 -10px 30px rgba(212,160,23,.18)}
.pstep.p2 .pblock{border-top-color:var(--silver)}
.pstep.p3 .pblock{border-top-color:var(--bronze)}
.av{box-shadow:0 0 0 2px var(--bg2),0 0 0 3px color-mix(in srgb,var(--line) 80%,transparent)}
/* popover colonne */
.colpop{border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg2) 92%,transparent)}
/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 45%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mut) 40%,transparent);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
/* entrata pagina */
main{animation:pagein .25s ease-out}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main,nav.menu,nav.menu a{animation:none!important}}
table.t td.gap{color:var(--mut);font-size:13px}

.yearsx{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.yearsx a{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.yearsx a.nodata{justify-content:center;min-height:64px}
.yhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.yhd b{font-size:30px}
.ystate{font-size:12px!important;color:var(--mut);font-weight:600}.ystate.live{color:var(--red2)}
.t3{display:flex;flex-direction:column;gap:2px}
.t3t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:2px}
.t3r{display:grid;grid-template-columns:24px 1fr 52px 50px 50px;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.t3h{font-size:10px;color:var(--mut);text-align:right;margin-top:-2px}.t3h span{display:inline!important;overflow:visible!important;white-space:nowrap}
.yearsx .t3r span{display:block;color:inherit;font-size:inherit}
.t3p{text-align:center;border-radius:5px;font-weight:700;font-size:12px!important;color:#111!important;line-height:18px}
.t3n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)!important}
.t3pt{text-align:right;font-weight:700;color:var(--ink)!important}
.t3g{text-align:right;color:var(--mut)!important;font-size:12px!important}

/* podio Home v2.8 */
.podium2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:860px;margin:20px auto 0}
.pc{display:flex;flex-direction:column}
.pcard{position:relative;border-radius:16px 16px 0 0;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--tc,var(--red)) 55%,#000 10%),color-mix(in srgb,var(--tc,var(--red)) 18%,var(--bg2)) 70%,var(--bg2));border:1px solid color-mix(in srgb,var(--tc,var(--red)) 45%,var(--line));border-bottom:0;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.pcard.empty{min-height:120px;display:flex;align-items:center;justify-content:center}
.pphoto{position:relative;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pc.p1 .pphoto{aspect-ratio:4/5.4}.pc.p3 .pphoto{aspect-ratio:4/4.5}
.pphoto::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
.pphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pphoto::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--tc,var(--red)) 18%,var(--bg2)))}
.pini{position:relative;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(40px,9vw,84px);color:rgba(255,255,255,.92);text-shadow:0 6px 24px rgba(0,0,0,.35);letter-spacing:1px}
.pnum{position:absolute;left:10px;top:4px;z-index:2;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(34px,6vw,58px);line-height:1;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.pcard.empty .pnum{position:static;color:var(--mut)}
.pno{position:absolute;right:10px;top:8px;z-index:2;font-family:var(--disp);font-weight:900;font-style:italic;font-size:18px;color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.ptext{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 8px 12px;margin-top:-34px}
.ptext .pname{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(15px,2.6vw,24px);line-height:1.05;letter-spacing:.3px;display:flex;flex-direction:column;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.ptext .pname small{font-size:.55em;font-weight:700;letter-spacing:.6px;opacity:.85}
.pc.p1 .ptext .pname{font-size:clamp(17px,3.2vw,30px)}
.ptext .pteam{font-size:12px;color:color-mix(in srgb,var(--ink) 80%,transparent);display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.ptext .ptime{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ppts{font-weight:800;font-size:13px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:1px 10px;margin-top:2px}
.pbase{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-style:italic;font-size:26px;color:#111;border-radius:0 0 6px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pc.p1 .pbase{height:58px;background:linear-gradient(180deg,#f3cb4a,#b98a10)}
.pc.p2 .pbase{height:40px;background:linear-gradient(180deg,#dfe3e8,#959ca7)}
.pc.p3 .pbase{height:26px;background:linear-gradient(180deg,#d9955c,#9c5a28);font-size:20px}
.pc.p1 .pcard{box-shadow:0 18px 50px rgba(212,160,23,.18),0 16px 40px rgba(0,0,0,.35)}
@media(max-width:600px){.podium2{gap:6px}.ordtb th:nth-child(4),.ordtb td:nth-child(4){display:none}.ptext{padding:4px 4px 10px}.ptext .pteam{font-size:10.5px}.pno{font-size:13px;right:6px}.pnum{left:6px}.ppts{font-size:11px;padding:1px 6px}}

/* punti scuderie */

.tpval{text-align:right;display:flex;flex-direction:column;line-height:1.15}.tpval b{font-size:16px}.tpval small{color:var(--mut);font-size:11px}

td.cbest{background:color-mix(in srgb,var(--green) 18%,transparent)!important;font-weight:700}
.clc{font-weight:700;color:var(--gold)}.clc.last{color:var(--mut);font-weight:600;font-size:12px}.clyr{color:var(--mut);font-size:11px;margin-right:3px}

table.sortt thead th{cursor:pointer;user-select:none}table.sortt th.s-asc::after{content:' ▲';color:var(--red2)}table.sortt th.s-desc::after{content:' ▼';color:var(--red2)}
.tchipd .tcd{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--ink)}

.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.reccard h3{margin:0 0 8px;font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:15px;letter-spacing:.4px}
.reclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.reclist li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:8px}
.reclist li:nth-child(odd){background:color-mix(in srgb,var(--bg3) 50%,transparent)}
.rpos{font-family:var(--disp);font-weight:900;font-style:italic;text-align:center;color:var(--mut)}
.reclist .top1 .rpos{color:#f3cb4a}.reclist .top2 .rpos{color:#d3d8df}.reclist .top3 .rpos{color:#d38c52}
.reclist .top1{background:linear-gradient(90deg,rgba(243,203,74,.14),transparent)!important}
.rwho{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0}.rwho .av{margin-right:2px}
.rval{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* dati numerici centrati in tutte le tabelle */
table.t td.n,table.t th.n{text-align:center!important}
.gap{text-align:center!important}
.tpname,.tpn1{text-align:left;justify-content:flex-start;align-items:flex-start}.tpn1{align-items:center}.tpname .lk{justify-content:flex-start}
.tprow{grid-template-columns:22px minmax(120px,220px) 84px 1fr 110px}
@media(max-width:600px){.tprow{grid-template-columns:18px 1fr 56px 70px}.tpbar{grid-column:2/5}}

/* colonne personali */
.ucv{display:inline-block;min-width:40px;min-height:18px;cursor:text;border-radius:4px;padding:0 4px}
.ucv:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.ucph{color:var(--mut);opacity:.45;font-size:12px}
.ucmark{cursor:pointer;color:var(--mut);font-size:11px;margin-left:3px}.ucmark:hover{color:var(--red2)}
th.ucadd,td.ucadd{width:34px;padding:2px 4px!important;text-align:center}th.ucadd .btn{min-height:22px;padding:0 8px;font-size:13px}
.ucth{white-space:nowrap}
.ucrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0}
.ucin{min-width:90px;text-align:left}
.ucbtns{display:inline-flex;gap:4px}.cornerbtns{display:inline-flex;gap:4px;align-items:center}
th.ucadd{width:auto}

.evlinks{display:inline-flex;flex-wrap:wrap;gap:4px 8px;margin-left:8px;vertical-align:middle}
.evl{display:inline-flex;align-items:center;gap:2px;background:color-mix(in srgb,#4a9bf0 14%,transparent);border:1px solid color-mix(in srgb,#4a9bf0 35%,transparent);border-radius:999px;padding:0 4px 0 8px;font-size:12px}
.evl a{color:#7fb2f0;text-decoration:none}.evl a:hover{text-decoration:underline}
.evlx{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0 3px}.evlx:hover{color:var(--red2)}
.evladd{background:none;border:1px dashed var(--line);border-radius:999px;color:var(--mut);cursor:pointer;font-size:11px;padding:0 7px;opacity:.55}
.evladd:hover,.ev:hover .evladd{opacity:1;border-color:#4a9bf0;color:var(--ink)}

/* gruppi del menù */
.navgrp{display:flex;flex-direction:column}
.navgh{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 18px;cursor:pointer;color:#f2f2f5;
 font-family:'Titillium Web',system-ui,sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:1.6px;font-size:21px;line-height:1.15;
 transform:skewX(-8deg);border:0;border-left:4px solid transparent;border-right:4px solid transparent;border-radius:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);transition:background .15s,border-color .15s}
.navgh:hover{background:linear-gradient(90deg,transparent,rgba(225,6,0,.25),transparent);border-left-color:var(--red);border-right-color:var(--red)}
.navgrp.hason>.navgh{border-left-color:var(--red);border-right-color:var(--red)}
.navchev{font-style:normal;font-size:14px;transition:transform .2s;opacity:.8}
.navgrp.open .navchev{transform:rotate(180deg)}
.navsub{display:none;flex-direction:column;gap:4px;margin:6px 0 4px;padding:0 26px}
.navgrp.open .navsub{display:flex}
nav.menu .navsub a{font-size:17px;padding:9px 16px;letter-spacing:1.2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.025),transparent);animation:none}
nav.menu .navsub a::before{content:'›';margin-right:8px;opacity:.6}

.homehead .cy{display:inline-flex;align-items:center;gap:10px}
.yrbtn{font-family:var(--disp);font-weight:900;font-style:italic;font-size:15px;padding:3px 12px;min-height:0;background:linear-gradient(180deg,#ff2a1f,var(--red));border-color:#ff2a1f;color:#fff;text-decoration:none;letter-spacing:.5px}
.resicon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;font-size:20px;flex:none;transition:border-color .15s,transform .1s}
.resicon:hover{border-color:var(--red)}.resicon:active{transform:scale(.95)}
@media(max-width:600px){.resicon{width:34px;height:34px;font-size:17px}}
.tlogo{width:auto;max-width:40px;object-fit:contain;vertical-align:middle;margin-right:5px}
.tlogobig{display:inline-flex;margin-right:12px}.tlogobig .tlogo{max-width:120px;height:44px!important;margin:0}

.awteamlogo{display:flex;align-items:center;gap:12px;text-decoration:none}
.awteamlogo .tlogo{height:52px!important;max-width:130px;margin:0}
.awtname{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:20px;line-height:1.05;color:var(--ink)}
.awtsw .tc{width:6px;height:40px;border-radius:3px}
.awdrv{display:flex;align-items:center;gap:6px;font-size:13px;position:relative;z-index:1}.awdrv .av{margin-right:2px}
.milest{display:flex;flex-direction:column;gap:2px;margin:10px 0 14px;max-width:560px}
.mrow{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--bg3) 55%,transparent);font-size:14px}
.ml{color:var(--mut);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;align-self:center}

.trk{font:inherit;font-weight:700;min-width:30px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);cursor:pointer}
.trk:hover,.trk.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--bg3))}
.trkd{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trky{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:700;text-decoration:none}
.trktb th.trs{background:linear-gradient(180deg,color-mix(in srgb,#e2582b 22%,var(--bg3)),color-mix(in srgb,#e2582b 12%,var(--bg3)))}
.fcl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px;margin-top:4px}.fcl label{flex-direction:row!important;align-items:center;gap:6px;font-weight:500!important;color:var(--ink)!important}
.fcth,.vg-h.fcc{color:#7fb2f0!important}td.fcc,.vg-c.fcc{color:#9cc6f5;font-weight:600}
.qsel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}.qsel .small{margin-right:4px}
table.t td.qcol{background:color-mix(in srgb,var(--red) 10%,var(--bg2))!important;font-weight:700}.qon{color:var(--red2)}

const API = 'https://api.jolpi.ca/ergast/f1';

// ---------- IndexedDB ----------
const Store = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('f1-historic', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  _tx(mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(undefined);
      const t = this.db.transaction('kv', mode), rq = fn(t.objectStore('kv'));
      t.oncomplete = () => res(rq ? rq.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  get(k) { return this._tx('readonly', s => s.get(k)); },
  set(k, v) { return this._tx('readwrite', s => s.put(v, k)); },
  del(k) { return this._tx('readwrite', s => s.delete(k)); },
  clear() { return this._tx('readwrite', s => s.clear()); },
  entries() {
    return new Promise((res, rej) => {
      if (!this.db) return res([]);
      const t = this.db.transaction('kv', 'readonly'), st = t.objectStore('kv');
      const a = st.getAllKeys(), b = st.getAll();
      t.oncomplete = () => res(a.result.map((k, i) => [k, b.result[i]]));
      t.onerror = () => rej(t.error);
    });
  }
};

const D = { seasons: {}, drivers: {}, cons: {}, circuits: {}, enrich: null, meta: { lastSync: 0 } };

async function loadAll() {

    else if (k === 'cons') D.cons = v;
    else if (k === 'circuits') D.circuits = v;
    else if (k === 'enrich') D.enrich = v;
    else if (k === 'meta') D.meta = v;
  }
}

// ---------- rete con limiti di frequenza ----------
const Sync = { running: false, cancel: false, msg: '', wait: '', done: 0, total: 0, req: 0, err: null, onProgress: () => {}, onSeason: () => {} };
const Net = { last: 0, gap: (typeof process !== 'undefined' && process.env && +process.env.F1_GAP) || 900 };

async function waitMsg(ms, txt) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    if (Sync.cancel) throw new Error('Download interrotto');
    Sync.wait = `${txt} tra ${Math.ceil((end - Date.now()) / 1000)} s`;
    Sync.onProgress(); await sleep(1000);
  }
  Sync.wait = ''; Sync.onProgress();
}
// registro delle richieste a Jolpica dell'ultima ora (per restare sotto 500/ora)
const JOL_BUDGET = 440;
const ReqLog = {
  list: (() => { try { return JSON.parse(localStorage.getItem('f1h-reqlog') || '[]'); } catch (e) { return []; } })(),
  prune() { const lim = Date.now() - 3600e3; this.list = this.list.filter(t => t > lim); },
  add() { this.list.push(Date.now()); this.prune(); try { localStorage.setItem('f1h-reqlog', JSON.stringify(this.list)); } catch (e) {} },
  count() { this.prune(); return this.list.length; },

async function apiGet(path, opt = {}) {
  const full = /^https?:/.test(path) ? path : API + path;
  const isJol = full.startsWith(API);
  let attempt = 0;
  for (;;) {
    if (Sync.cancel) throw new Error('Download interrotto');
    if (isJol && ReqLog.count() >= JOL_BUDGET) {
      const ms = ReqLog.list[0] + 3600e3 - Date.now() + 2000;
      await waitMsg(ms, `Pausa per rispettare il limite di Jolpica (500 richieste/ora, ${ReqLog.count()} usate): riprendo`);
      continue;
    }
    const w = Net.last + Net.gap - Date.now(); if (w > 0) await sleep(w);
    Net.last = Date.now();
    if (isJol) ReqLog.add();
    let r;
    try { r = await fetch(full, { headers: { Accept: 'application/json' } }); }
    catch (e) {
      attempt++; if (attempt > 5) throw new Error('API non raggiungibile (controlla la connessione)');
      await waitMsg(4000 * attempt, 'Errore di rete, nuovo tentativo'); continue;
    }
    Sync.req++;
    if (r.status === 429) {
      attempt++; Sync.throttled = (Sync.throttled || 0) + 1;
      if (isJol && opt.fallback) { Net.jolBlockedUntil = Date.now() + 20 * 60e3; const e = new Error('Jolpica ha bloccato le richieste'); e.code = 'RATE'; throw e; }
      const ra = +(r.headers.get('Retry-After') || 0) * 1000;
      const ms = Math.max(ra, [120e3, 300e3, 600e3][Math.min(attempt - 1, 2)]);
      await waitMsg(ms, `${isJol ? 'Jolpica' : 'L\'API'} ha bloccato temporaneamente le richieste da questa connessione (limite per indirizzo IP)${isJol ? ', spesso condiviso sulle reti mobili' : ''}. Riprovo`);
      continue;
    }
    if (r.status >= 500) {
      attempt++; if (attempt > 5) throw new Error('Server API non disponibile (' + r.status + ')');
      await waitMsg(5000 * attempt, 'Server non disponibile, riprovo'); continue;
    }
    if (opt.allow404 && (r.status === 404 || r.status === 400)) return null;
    if (!r.ok) throw new Error('Errore HTTP ' + r.status + ' su ' + full);
    const j = await r.json();
    return opt.raw ? j : j.MRData;
  }
}
async function pagedAll(path, extract) {
  let off = 0, total = 1; const out = [];
  while (off < total) {
    const m = await apiGet(`${path}${path.includes('?') ? '&' : '?'}limit=100&offset=${off}`, { fallback: Sync.fallback });
    total = +m.total || 0; out.push(...(extract(m) || [])); off += 100;
  }

}
function mergeRaces(list, key) {
  const by = {};
  for (const R of list) {
    if (!by[R.round]) by[R.round] = Object.assign({}, R, { [key]: [] });
    by[R.round][key].push(...(R[key] || []));
  }
  return Object.values(by);
}

// ---------- conversione ----------
function ingDriver(x) {
  if (!x) return;
  D.drivers[x.driverId] = { id: x.driverId, gn: x.givenName, fn: x.familyName, dob: x.dateOfBirth || '', nat: x.nationality || '', code: x.code || '', pn: x.permanentNumber || '', url: x.url || '' };
}
function ingCons(x) { if (x) D.cons[x.constructorId] = { id: x.constructorId, name: x.name, nat: x.nationality || '', url: x.url || '' }; }

  const r = s.races[R.round] || (s.races[R.round] = { round: +R.round });
  r.name = R.raceName; r.date = R.date; r.time = R.time || ''; r.url = R.url || '';
  if (R.Sprint) r.sprintDate = R.Sprint.date;
  const C = R.Circuit;
  if (C) {
    r.circ = C.circuitId;
    D.circuits[C.circuitId] = { id: C.circuitId, name: C.circuitName, loc: C.Location?.locality || '', country: C.Location?.country || '', lat: C.Location?.lat, long: C.Location?.long, url: C.url || '' };
  }
}

function convRes(x) {
  ingDriver(x.Driver); ingCons(x.Constructor);

  return { d: x.Driver.driverId, c: x.Constructor.constructorId, n: x.number || '', p: num(x.position), pt: x.positionText || '', g: num(x.grid),
    l: +x.laps || 0, s: x.status || '', pts: +x.points || 0, t: x.Time?.time || '',
    fl: f ? { r: num(f.rank), lap: num(f.lap), t: f.Time?.time || '' } : null };
}
function convQ(x) {
  ingDriver(x.Driver); ingCons(x.Constructor);

}
const newSeason = y => ({ year: y, races: {}, res: {}, spr: {}, q: {}, dst: [], cst: [], done: {}, fetchedAt: 0, final: false });

async function syncSeason(y, what) {
  const s = D.seasons[y] || (D.seasons[y] = newSeason(y));
  if (what.sched) {
    const races = await pagedAll(`/${y}.json`, m => m.RaceTable?.Races);
    races.forEach(R => ingRace(s, R)); s.done.sched = true;
  }
  if (what.res) {
    const races = mergeRaces(await pagedAll(`/${y}/results.json`, m => m.RaceTable?.Races), 'Results');
    s.res = {};
    for (const R of races) { ingRace(s, R); s.res[R.round] = R.Results.map(convRes); }
    s.done.res = true;
  }
  if (what.spr && y >= 2021) {
    const races = mergeRaces(await pagedAll(`/${y}/sprint.json`, m => m.RaceTable?.Races), 'SprintResults');
    s.spr = {};
    for (const R of races) { ingRace(s, R); s.spr[R.round] = R.SprintResults.map(convRes); }
    s.done.spr = true;
  }
  if (what.st) {
    const L = await pagedAll(`/${y}/driverstandings.json`, m => m.StandingsTable?.StandingsLists);
    s.dst = L.flatMap(l => l.DriverStandings || []).map(x => {
      ingDriver(x.Driver);
      return { d: x.Driver.driverId, p: num(x.position), pt: x.positionText || '', pts: +x.points || 0, w: +x.wins || 0, cs: (x.Constructors || []).map(c => { ingCons(c); return c.constructorId; }) };
    });
    if (y >= 1958) {
      const C = await pagedAll(`/${y}/constructorstandings.json`, m => m.StandingsTable?.StandingsLists);
      s.cst = C.flatMap(l => l.ConstructorStandings || []).map(x => {
        ingCons(x.Constructor);
        return { c: x.Constructor.constructorId, p: num(x.position), pt: x.positionText || '', pts: +x.points || 0, w: +x.wins || 0 };
      });
    }
    s.done.st = true;
  }
  if (what.q && y >= 1994) {
    const races = mergeRaces(await pagedAll(`/${y}/qualifying.json`, m => m.RaceTable?.Races), 'QualifyingResults');
    s.q = {};
    for (const R of races) { ingRace(s, R); s.q[R.round] = R.QualifyingResults.map(convQ); }
    s.done.q = true;
  }
  s.fetchedAt = Date.now();
  s.final = y < CUR_YEAR && s.done.res && s.done.st && (y < 2021 || s.done.spr) && (y < 1994 || s.done.q) && s.fetchedAt > Date.UTC(y + 1, 0, 1);
  await Store.set('season:' + y, s);
  await saveMasters();
}

async function runSync(opts = {}) {
  if (Sync.running) return;
  Object.assign(Sync, { running: true, cancel: false, err: null, done: 0, req: 0, wait: '' });
  Sync.onProgress();

    const tasks = [];
    if (opts.years) {
      const ys = [...new Set(opts.years)].sort((x, z) => z - x);
      for (const y of ys) { tasks.push({ y, ph: 1 }); if (y >= 1994) tasks.push({ y, ph: 2 }); }
    } else for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) {
      const s = D.seasons[y];
      if (opts.full || !s || !s.final || !(s.done && s.done.res && s.done.st)) tasks.push({ y, ph: 1 });
    }
    if (!opts.years) for (let y = CUR_YEAR; y >= 1994; y--) {
      const s = D.seasons[y];
      if (opts.full || !s || !s.final || !(s.done && s.done.q)) tasks.push({ y, ph: 2 });
    }

    if (src === 'jolpica' && opts.fallback && Date.now() < (Net.jolBlockedUntil || 0)) { src = 'f1api'; Sync.switched = true; }

    for (const t of tasks) {

      Sync.cur = t.y; Sync.onProgress();
      try {
        if (src === 'f1api') { if (t.ph === 1) await syncSeasonF1A(t.y); }
        else if (t.ph === 1) { await syncSeason(t.y, { sched: t.y >= CUR_YEAR, res: 1, spr: 1, st: 1 }); D.seasons[t.y].src = 'jolpica'; D.seasons[t.y].manual = false; }

        src = 'f1api'; Sync.switched = true;
        Sync.msg = `Jolpica bloccata: continuo con f1api.dev (stagione ${t.y})`; Sync.onProgress();
        const s = D.seasons[t.y];

    }

    Sync.msg = 'Dati aggiornati';
  } catch (e) { Sync.err = e.message; Sync.msg = ''; }

}

}

// risultati validi (scarti) del Mondiale Piloti: n = migliori n; h = [gare 1ª metà, migliori 1ª metà, migliori 2ª metà]
const DROPS = { 1950: { n: 4 }, 1951: { n: 4 }, 1952: { n: 4 }, 1953: { n: 4 }, 1954: { n: 5 }, 1955: { n: 5 }, 1956: { n: 5 }, 1957: { n: 5 }, 1958: { n: 6 }, 1959: { n: 5 }, 1960: { n: 6 },
  1961: { n: 5 }, 1962: { n: 5 }, 1963: { n: 6 }, 1964: { n: 6 }, 1965: { n: 6 }, 1966: { n: 5 }, 1967: { h: [6, 5, 4] }, 1968: { h: [6, 5, 5] }, 1969: { h: [6, 5, 4] }, 1970: { h: [7, 6, 5] },
  1971: { h: [6, 5, 4] }, 1972: { h: [6, 5, 5] }, 1973: { h: [8, 7, 6] }, 1974: { h: [8, 7, 6] }, 1975: { h: [7, 6, 6] }, 1976: { h: [8, 7, 7] }, 1977: { h: [9, 8, 7] }, 1978: { h: [8, 7, 7] },
  1979: { h: [7, 4, 4] }, 1980: { h: [7, 5, 5] } };
for (let y = 1981; y <= 1990; y++) DROPS[y] = { n: 11 };
const bestSum = (arr, n) => arr.slice().sort((a, b) => b - a).slice(0, n).reduce((s, v) => s + v, 0);
// punti validi da un elenco di punti per gara (indice = gara)
function countedPts(y, perRace) {
  const r = DROPS[y];
  if (!r) return perRace.reduce((s, v) => s + (v || 0), 0);

// gara in cui il titolo è diventato matematicamente sicuro
function clinchRound(yi, kind) {

  const k = kind === 'd' ? 'd' : 'c';
  const top = rows => { const by = {}; for (const x of rows) by[x[k]] = (by[x[k]] || 0) + (x.pts || 0); const p = Object.values(by).sort((a, b) => b - a); return p[0] || 0; };

  // controlla se il titolo è sicuro: dopo la gara i (raceLeft = la gara i è ancora da correre, Sprint già corsa)
  const check = (i, raceLeft) => {
    const cur = Object.keys(pr).map(id => ({ id, v: countedPts(y, pr[id]) })).sort((a, b) => b.v - a.v);
    if (!cur.length) return null;
    const lead = cur[0];

// ---------- What If ----------
function whatIf(y, cfg) {
  const yi = M.yi[y]; if (!yi) return null;
  const drv = {}, con = {};

  const C_ = c => con[c] || (con[c] = { id: c, pts: 0, cnt: {} });
  for (const race of yi.races) {
    if (!race.done) continue;
    const per = {};
    for (const x of race.res) {
      if (!isNum(x)) { if (isStart(x)) D_(x.d); continue; }
      const p = (cfg.pts[x.p - 1] || 0);
      per[x.d] = Math.max(per[x.d] || 0, p);
      D_(x.d).cnt[x.p] = (D_(x.d).cnt[x.p] || 0) + 1;
      C_(x.c).pts += p; C_(x.c).cnt[x.p] = (C_(x.c).cnt[x.p] || 0) + 1;
    }
    if (cfg.fl && race.fl) {
      const fr = race.res.find(x => x.d === race.fl.d);
      if (fr && (!cfg.flTop || (isNum(fr) && fr.p <= cfg.flTop))) { per[race.fl.d] = (per[race.fl.d] || 0) + cfg.fl; C_(fr.c).pts += cfg.fl; }

    if (race.spr.length && cfg.sprint !== 'none') {
      for (const x of race.spr) {
        const p = cfg.sprint === 'real' ? x.pts : (isNum(x) ? (cfg.sprint[x.p - 1] || 0) : 0);
        D_(x.d).spr += p; C_(x.c).pts += p;

    }
  }
  const cb = (a, b) => { for (let p = 1; p <= 40; p++) { const d = (b.cnt[p] || 0) - (a.cnt[p] || 0); if (d) return d; } return 0; };
  const dl = Object.values(drv).map(o => {
    const s = o.scores.slice().sort((a, b) => b - a);
    const used = cfg.best > 0 ? s.slice(0, cfg.best) : s;
    o.tot = used.reduce((a, b) => a + b, 0) + o.spr;
    const real = yi.dst.find(e => e.d === o.id); o.realPos = real ? real.p : null; o.realPts = real ? real.pts : null;

  dl.forEach((o, i) => o.pos = i + 1);

}

async function loadOF1(race, force) {
  if (race.y < 2023) return null;
  const key = 'of1:' + race.key;
  if (!force) { const c = await Store.get(key); if (c && (c.final || Date.now() - c.at < 3600e3)) return c; }
  const meets = await of1Meetings(race.y);
  const rd = Date.parse(race.date);
  const m = meets.find(x => { const d = Date.parse(x.d); return rd >= d - 86400e3 && rd <= d + 5 * 86400e3; });
  if (!m) return null;
  const sessions = (await of1Get(`/sessions?meeting_key=${m.k}`)).filter(s => OF1_SESS[s.session_name]);
  const out = { at: Date.now(), meeting: m.n, sessions: [], ev: [], final: false };
  for (const s of sessions) {
    const it = OF1_SESS[s.session_name];
    const rc = (await of1Get(`/race_control?session_key=${s.session_key}`)).map(x => ({ d: x.date, l: x.lap_number, c: x.category, f: x.flag, m: x.message }));
    const wx = (await of1Get(`/weather?session_key=${s.session_key}`)).map(x => ({ d: x.date, r: x.rainfall }));
    const sess = { name: it, start: s.date_start, end: s.date_end };
    out.sessions.push({ ...sess, rc });
    out.ev.push(...deriveOF1(it, rc, wx, sess));

  out.final = Date.now() - rd > 3 * 86400e3;
  await Store.set(key, out);
  return out;
}

function colPrefs(key) { try { return JSON.parse(localStorage.getItem('f1h-cols-' + key) || 'null'); } catch (e) { return null; } }
function saveColPrefs(key, p) { try { localStorage.setItem('f1h-cols-' + key, JSON.stringify(p)); } catch (e) {} }
function colOrder(key, defs) {
  const p = colPrefs(key), ids = defs.map(d => d.id);
  if (!p || !p.order) return ids;
  const order = p.order.filter(id => ids.includes(id));
  ids.forEach((id, i) => { if (!order.includes(id)) { const prev = ids.slice(0, i).reverse().find(x => order.includes(x)); order.splice(prev ? order.indexOf(prev) + 1 : 0, 0, id); } });
  return order;
}
function colHidden(key, defs) { const p = colPrefs(key); return new Set(p ? (p.hidden || []) : defs.filter(d => d.off).map(d => d.id)); }

function drawCompare(st) {
  const out = $('#cpOut'); if (!out) return;
  const ds = [...st.d];
  if (ds.length < 2) { out.innerHTML = '<p class="mut">Scegli almeno 2 piloti da confrontare.</p>'; return; }
  const allY = M.years.slice().sort((a, b) => a - b), yf = st.yf || allY[0], yt = st.yt || allY[allY.length - 1], fullY = yf === allY[0] && yt === allY[allY.length - 1];
  const inScope = r => r.done && r.y >= yf && r.y <= yt && (!st.c.size || st.c.has(r.circ));
  const races = M.races.filter(inScope).sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.r - b.r);
  const S = {}, row = (r, d) => r.res.filter(x => x.d === d && (!st.t.size || st.t.has(x.c)));
  for (const d of ds) S[d] = { races: 0, wins: 0, pod: 0, poles: 0, fl: 0, pts: 0, ret: 0, top10: 0, best: null, sPos: 0, nPos: 0, sQ: 0, nQ: 0, sw: 0, sr: 0, spts: 0, laps: 0, ledAll: 0 };
  for (const r of races) for (const d of ds) {
    const rr = row(r, d), s = S[d];
    if (rr.some(isStart)) {
      s.races++; const nums = rr.filter(isNum).map(x => x.p); const b = nums.length ? Math.min(...nums) : null;
      if (b === 1) s.wins++; if (b != null && b <= 3) s.pod++; if (b != null && b <= 10) s.top10++;
      if (b != null) { s.sPos += b; s.nPos++; if (s.best == null || b < s.best) s.best = b; }
      if (rr.filter(isStart).every(isRet)) s.ret++;
      for (const x of rr) { s.pts += x.pts || 0; s.laps += x.l || 0; }
      const q = (r.q || []).find(x => x.d === d), g = rr.find(x => x.g > 0);
      const qp = q && q.p ? q.p : (g ? g.g : null); if (qp) { s.sQ += qp; s.nQ++; }
    }
    if (r.pole && r.pole.d === d && (!st.t.size || st.t.has(r.pole.c))) s.poles++;
    if (r.fl && r.fl.d === d && row(r, d).length) s.fl++;
    const sp = (r.spr || []).filter(x => x.d === d && (!st.t.size || st.t.has(x.c)));
    if (sp.some(isStart)) { s.sr++; if (sp.some(x => isNum(x) && x.p === 1)) s.sw++; for (const x of sp) { s.spts += x.pts || 0; s.pts += x.pts || 0; } }
  }
  // titoli e miglior posizione (solo se non si filtra per circuito)
  const yrs = M.years.filter(y => y >= yf && y <= yt);
  for (const d of ds) { const s = S[d]; s.titles = 0; s.bestCh = null; if (st.c.size) continue;
    if (st.t.size) { for (const y of yrs) { const o = M.dy[d] && M.dy[d][y]; if (!o || !o.teams.some(c => st.t.has(c))) continue; if (M.yi[y]?.complete && M.yi[y].champ === d) s.titles++; if (o.pos != null && (s.bestCh == null || o.pos < s.bestCh)) s.bestCh = o.pos; } continue; }
    for (const y of yrs) { const o = M.dy[d] && M.dy[d][y]; if (!o) continue; if (M.yi[y]?.complete && M.yi[y].champ === d) s.titles++; if (o.pos != null && (s.bestCh == null || o.pos < s.bestCh)) s.bestCh = o.pos; } }
  // testa a testa: gare in cui hanno corso entrambi
  const h2h = {};
  for (const a of ds) for (const b of ds) if (a !== b) h2h[a + '|' + b] = { race: 0, q: 0, n: 0, nq: 0 };
  for (const r of races) {
    const fin = {}, qq = {};
    for (const d of ds) { const rr = row(r, d); if (!rr.some(isStart)) continue; const nums = rr.filter(isNum).map(x => x.p); fin[d] = nums.length ? Math.min(...nums) : 999 + (rr[0].l ? 100 - Math.min(99, rr[0].l / 10) : 0); const q = (r.q || []).find(x => x.d === d), g = rr.find(x => x.g > 0); qq[d] = q && q.p ? q.p : (g ? g.g : null); }
    for (const a of Object.keys(fin)) for (const b of Object.keys(fin)) { if (a === b) continue; const h = h2h[a + '|' + b]; h.n++; if (fin[a] < fin[b]) h.race++; if (qq[a] && qq[b]) { h.nq++; if (qq[a] < qq[b]) h.q++; } }
  }
  const pc = (a, b) => b ? Math.round(a / b * 1000) / 10 : null;
  const STATS = [
    ['Gare', s => s.races, 1], ['Vittorie', s => s.wins, 1], ['% vittorie', s => pc(s.wins, s.races), 1, v => fmtPct(v)], ['Podi', s => s.pod, 1], ['% podi', s => pc(s.pod, s.races), 1, v => fmtPct(v)],
    ['Pole position', s => s.poles, 1], ['Giri più veloci', s => s.fl, 1], ['Arrivi a punti / top 10', s => s.top10, 1], ['Punti', s => s.pts, 1, v => fmtPts(v)], ['Punti per gara', s => s.races ? s.pts / s.races : null, 1, v => v == null ? '—' : fmtPts(Math.round(v * 100) / 100)],
    ['Miglior risultato', s => s.best, -1, v => v == null ? '—' : v + '°'], ['Arrivo medio', s => s.nPos ? s.sPos / s.nPos : null, -1, v => fmtAvg(v)], ['Qualifica media', s => s.nQ ? s.sQ / s.nQ : null, -1, v => fmtAvg(v)], ['Ritiri', s => s.ret, -1],

    ...(st.c.size ? [] : [['Titoli mondiali', s => s.titles, 1], ['Miglior pos. campionato', s => s.bestCh, -1, v => v == null ? '—' : v + '°']]),
  ];
  const scope = [st.c.size ? [...st.c].map(c => (D.circuits[c] || {}).name || c).join(', ') : '', st.t.size ? [...st.t].map(cName).join(', ') : '', fullY ? '' : `${yf}–${yt}`].filter(Boolean).join(' · ') || 'Intera carriera';
  const head = `<tr><th></th>${ds.map(d => `<th class="c cmph">${avatar(d, 40)}<br>${dl(d)}</th>`).join('')}</tr>`;
  const body = STATS.map(([l, f, dir, fm]) => { const vals = ds.map(d => f(S[d])); const ok = vals.filter(v => v != null); const best = ok.length ? (dir > 0 ? Math.max(...ok) : Math.min(...ok)) : null;
    return `<tr><td><b>${l}</b></td>${ds.map((d, i) => { const v = vals[i]; const isB = v != null && v === best && ok.length > 1 && !(ok.every(x => x === best)); return `<td class="c ${isB ? 'cbest' : ''}">${fm ? fm(v, S[d]) : (v ?? '—')}</td>`; }).join('')}</tr>`; }).join('');

  const rTb = `<table class="t"><thead><tr><th>Gara</th>${ds.map(d => `<th class="c">${esc(D.drivers[d]?.fn || dName(d))}</th>`).join('')}</tr></thead><tbody>${shown.map(r => `<tr><td><a class="lk" data-race="${r.key}">${r.y} · ${esc(r.name)}</a></td>${ds.map(d => { const rr = row(r, d); return `<td class="c">${rr.length ? resCell(r, rr, d) + ' <span class="small mut">' + esc(cName(rr[0].c)) + '</span>' : '<span class="z">—</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  // per anno

  const val = tr => { const td = tr.children[ci]; if (!td) return ''; const raw = td.dataset.sv ?? td.textContent.trim(); const s = String(raw).replace(/[▲▼=×]\s*\d*/g, '').trim();

// griglia di partenza del pilota: miglior risultato da ogni casella + tutte le gare partite da lì
function profGrid(id) {
  const by = {};
  for (const r of M.races) { if (!r.done) continue; const x = r.res.find(z => z.d === id); if (!x || x.g == null || x.g === '' || !isStart(x)) continue; const k = x.g > 0 ? +x.g : 0; (by[k] || (by[k] = [])).push({ r, x }); }
  const ks = Object.keys(by).map(Number); if (!ks.length) return '';
  const max = Math.max(...ks.filter(k => k > 0), 2);
  const lab = x => isNum(x) ? x.p + '°' : ({ R: 'Rit', N: 'NC', D: 'SQ', E: 'Escl', W: 'NP', F: 'NQ' }[x.pt] || x.pt || '—');
  const best = list => { const n = list.filter(o => isNum(o.x)).sort((a, b) => a.x.p - b.x.p || (a.r.date || '').localeCompare(b.r.date || '')); return n[0] || list[0]; };
  const cls = x => isNum(x) ? (x.p <= 3 ? 'r' + x.p : x.pts > 0 ? 'rp' : 'rf') : 'rr';
  const slot = k => { const list = by[k]; const nm = k === 0 ? 'Box' : k;
    if (!list) return `<div class="gslot none"><span class="gpos">${nm}</span></div>`;
    const b = best(list), same = list.filter(o => lab(o.x) === lab(b.x)), nb = same.length;
    return `<button class="gslot" data-gslot="${k}" title="Miglior risultato ${lab(b.x)} ottenuto ${nb} ${nb === 1 ? 'volta' : 'volte'} su ${list.length} ${list.length === 1 ? 'partenza' : 'partenze'}"><span class="gpos">${nm}</span><span class="gbwrap"><span class="gbest r ${cls(b.x)}">${lab(b.x)}</span><span class="gx">×${nb}</span></span><span class="gmeta"><b>${esc((b.r.name || '').replace(/\s*(Grand Prix|Gran Premio|Grande Prémio)\s*/gi, ' ').trim())} ${b.r.y}</b>${nb} ${nb === 1 ? 'volta' : 'volte'} su ${list.length} ${list.length === 1 ? 'partenza' : 'partenze'}</span></button>`; };
  const panels = ks.map(k => { const list = by[k].slice().sort((a, b) => (isNum(a.x) ? a.x.p : 99) - (isNum(b.x) ? b.x.p : 99) || (b.r.date || '').localeCompare(a.r.date || ''));
    return `<div class="gpanel" data-gp="${k}" hidden><h3 style="margin:0 0 8px">Gare partite ${k === 0 ? 'dalla corsia box' : `dalla ${k}ª casella`} (${list.length})</h3><div class="scroll"><table class="t"><thead><tr><th>Anno</th><th>Gran Premio</th><th>Scuderia</th><th class="n">Arrivo</th><th class="n">Punti</th></tr></thead><tbody>${list.map(({ r, x }) => `<tr><td><a class="lk" href="#anno-${r.y}">${r.y}</a></td><td><a class="lk" data-race="${r.key}">${esc(r.name)}</a></td><td>${cl(x.c, r.y)}</td><td class="n"><span class="r ${cls(x)}">${lab(x)}</span></td><td class="n">${x.pts ? fmtPts(x.pts) : '<span class="z">0</span>'}</td></tr>`).join('')}</tbody></table></div></div>`; }).join('');
  const cells = []; for (let k = 1; k <= max; k++) cells.push(`<div class="gcell ${k % 2 ? 'gl' : 'gr'}">${slot(k)}</div>`);
  return `<h2>Griglia di partenza</h2><div class="card"><p class="small mut" style="margin-top:0">Per ogni casella il miglior risultato ottenuto partendo da lì. Tocca una casella per vedere tutte le gare partite da quella posizione.</p>
   <div class="gridwrap"><div class="gridf">${cells.join('')}</div>${by[0] ? `<div class="gpit">${slot(0)}</div>` : ''}</div>${panels}</div>`;
}
// tracciati: per ogni circuito gare, pole, vittorie, podi, top 10, ritiri (tocca un numero per vedere gli anni)
function profTracks(kind, id) {
  const isD = kind === 'd', T = {};
  for (const r of M.races) {
    if (!r.done) continue;
    const me = x => isD ? x.d === id : x.c === id;
    const mine = r.res.filter(me), sm = (r.spr || []).filter(me); if (!mine.length && !sm.length) continue;
    const o = T[r.circ] || (T[r.circ] = { c: r.circ, races: [], poles: [], wins: [], pod: [], t10: [], ret: [], fl: [], dotd: [], sr: [], sp: [], sw: [], spod: [], st10: [], sret: [], sfl: [] });
    const tmOf = d => { const z = r.res.concat(r.spr || []).find(q => q.d === d); return z ? z.c : null; };
    const hit = d => d && (isD ? d === id : tmOf(d) === id);
    if (r.fl && hit(r.fl.d)) o.fl.push(r);
    if (r.dotd && hit(r.dotd)) o.dotd.push(r);
    if (sm.length) {
      const sb = sm.filter(isNum).map(x => x.p).sort((a, b) => a - b)[0];
      if (sm.some(isStart)) o.sr.push(r);
      const sp = r.sPole ? r.sPole : (() => { const g = (r.spr || []).filter(x => x.g > 0).sort((a, b) => a.g - b.g)[0]; return g ? { d: g.d, c: g.c } : null; })();
      if (sp && (isD ? sp.d === id : sp.c === id)) o.sp.push(r);
      if (sb === 1) o.sw.push(r); if (sb != null && sb <= 3) o.spod.push(r); if (sb != null && sb <= 10) o.st10.push(r);
      if (sm.some(isRet)) o.sret.push(r);
      if (r.sFl && hit(r.sFl.d)) o.sfl.push(r);
    }
    if (!mine.length) continue;
    const best = mine.filter(isNum).map(x => x.p).sort((a, b) => a - b)[0];
    if (mine.some(isStart)) o.races.push(r);
    if (r.pole && (isD ? r.pole.d === id : r.pole.c === id)) o.poles.push(r);
    if (best === 1) o.wins.push(r);
    if (best != null && best <= 3) o.pod.push(r);
    if (best != null && best <= 10) o.t10.push(r);
    if (mine.some(isRet)) o.ret.push(r);

      out.innerHTML = `<div class="grid2"><div class="card"><h2 style="margin-top:0">Piloti ${w.y}</h2><div class="scroll">${tb(r.drivers.filter(o => o.tot > 0 || o.realPts > 0), true)}</div></div><div class="card"><h2 style="margin-top:0">Scuderie ${w.y}</h2><p class="mut small">Somma dei punti di tutte le vetture${w.y < 1958 ? ' (il Mondiale Costruttori non esisteva ancora)' : ''}.</p><div class="scroll">${tb(r.cons.filter(o => o.tot > 0 || o.realPts > 0), false)}</div></div></div>`;

  $('#wc').addEventListener('input', rd); rd();
}

let yearQueue = [];
function yearStatus(y) {
  const s = D.seasons[y];
  if (!s || !s.done || !s.done.res) return 'missing';
  const ok = s.done.st && (y < 2021 || s.done.spr) && (y < 1994 || s.done.q);
  return ok ? 'ok' : 'partial';
}
const yearOpts = sel => { let h = ''; for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) h += `<option ${y === sel ? 'selected' : ''}>${y}</option>`; return h; };
function yearGrid() {
  let h = '';
  for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) {
    const running = Sync.running && Sync.cur === y, queued = yearQueue.includes(y) || (Sync.running && Sync.years && Sync.years.includes(y) && !running && yearStatus(y) !== 'ok');
    const st = running ? 'run' : queued ? 'queued' : yearStatus(y);
    const s = D.seasons[y];
    const tip = s && s.src === 'excel' ? `Caricata da Excel il ${new Date(s.fetchedAt).toLocaleString('it-IT')}. Tocca per scaricarla da internet.` : s && s.manual ? 'Contiene gare inserite a mano: tocca per scaricare la stagione completa' : st === 'ok' ? `Scaricata da ${s.src === 'f1api' ? 'f1api.dev' : 'Jolpica'} il ${new Date(s.fetchedAt).toLocaleString('it-IT')}. Tocca per riscaricare.` : st === 'partial' ? 'Scaricata in parte: tocca per completare' : st === 'run' ? 'Download in corso' : st === 'queued' ? 'In coda' : 'Tocca per scaricare';
    h += `<button class="yb ${st}${s && s.src === 'f1api' ? ' alt' : ''}" data-y="${y}" title="${tip}">${y}<i>${{ ok: '✓', partial: '~', missing: '·', run: '↓', queued: '…' }[st]}</i></button>`;
  }
  return h;
}
function srcNote() {
  return SET.src === 'f1api'
    ? '<b>f1api.dev</b>: API gratuita e open source con dati dal 1950. Una gara alla volta (circa 50 richieste per stagione moderna). Limiti noti: mancano le Sprint 2021–2023, i giri completati e i non classificati; i giri veloci sono solo per pilota. Le stagioni scaricate da qui sono segnate con il bordo tratteggiato blu.'
    : '<b>Jolpica-F1</b>: erede di Ergast, dati completi dal 1950 (qualifiche dal 1994, giri veloci dal 2004). Da 3 a 12 richieste per stagione, limite 500 richieste all\'ora.';
}
function queueInfo() {
  if (Sync.running) return `In download: ${Sync.cur || ''}${Sync.switched ? ' (da f1api.dev, Jolpica bloccata)' : ''} ${Sync.wait ? '· ' + esc(Sync.wait) : ''}${yearQueue.length ? ` · in coda: ${yearQueue.length} stagioni` : ''}`;
  const n = Array.from({ length: CUR_YEAR - FIRST_YEAR + 1 }, (_, i) => FIRST_YEAR + i).filter(y => yearStatus(y) === 'ok').length;
  return `${n} stagioni complete su ${CUR_YEAR - FIRST_YEAR + 1}.${Sync.err ? ' Ultimo errore: ' + esc(Sync.err) : ''}`;
}
function refreshYearUI() { const g = $('#ygrid'); if (g) g.innerHTML = yearGrid(); const q = $('#qinfo'); if (q) q.innerHTML = queueInfo(); }
function queueYears(ys) {
  for (const y of ys) if (!yearQueue.includes(y) && !(Sync.running && Sync.cur === y)) yearQueue.push(y);
  refreshYearUI(); pumpQueue();
}
function pumpQueue() {
  if (Sync.running || !yearQueue.length) return;
  const ys = yearQueue.splice(0, yearQueue.length);
  runSync({ years: ys, src: SET.src, fallback: SET.fallback }).then(() => { rebuild(); refreshYearUI(); if (page === 'impostazioni' || /^anno/.test(page)) route(); else $('#newdata').hidden = false; pumpQueue(); });
  updateChip(); refreshYearUI();
}

async function downloadYearXlsx(y) {
  const of1 = {}; for (const r of M.races.filter(z => z.y === y && z.y >= 2023)) { try { const c = await Store.get('of1:' + r.key); if (c) of1[r.key] = c; } catch (e) {} }
  const blob = exportYearXlsx(y, of1);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `F1-History-${y}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function doXlImport(file, y, msgEl) {
  const fy = (file.name.match(/(19[5-9]\d|20\d\d)/) || [])[1];
  if (fy && +fy !== y) { msgEl.innerHTML = `<span style="color:#f5a623">Il nome del file indica il ${fy} ma hai scelto il ${y}: scegli l'anno giusto e ricarica il file.</span>`; return; }

      + `<br><a class="btn sm" href="#anno-${y}" style="margin-top:6px">Apri la stagione ${y}</a>`;

const PIT = { running: false, stop: false, done: 0, tot: 0, cur: '', ok: 0, err: 0, msg: '' };
const pitRaces = () => M.races.filter(r => r.y >= 2011 && r.done);
function pitInfoTxt() {
  const all = pitRaces(), have = all.filter(r => r.pit).length;

  if (PIT.running) return `<div class="small"><b>Download in corso: ${PIT.done}/${PIT.tot}</b> · ${esc(PIT.cur)}<div class="bar"><i style="width:${PIT.tot ? PIT.done / PIT.tot * 100 : 0}%"></i></div></div>`;
  return `<p class="small">Gare dal 2011 scaricate: <b>${all.length}</b> · con i pit stop: <b>${have}</b>${PIT.msg ? '<br>' + PIT.msg : ''}</p>`;
}
function pitRefresh() { const w = $('#pitwrap'); if (w) w.innerHTML = pitInfoTxt(); const s = $('#pitStop'); if (s) s.hidden = !PIT.running; const b = $('#pitAll'); if (b) b.disabled = PIT.running; }
async function pitDownloadAll() {
  if (PIT.running) return;
  const todo = pitRaces().filter(r => !r.pit).sort((a, b) => b.y - a.y || a.r - b.r);
  Object.assign(PIT, { running: true, stop: false, done: 0, tot: todo.length, ok: 0, err: 0, msg: '' });
  pitRefresh();
  for (const r of todo) {
    if (PIT.stop) break;
    PIT.cur = `${r.y} · ${r.name}`; pitRefresh();
    try { await loadPits(r); PIT.ok++; } catch (e) { PIT.err++; PIT.msg = esc(e.message); if (/bloccato|limite|raggiungibile/i.test(e.message)) break; }
    PIT.done++;
  }
  PIT.running = false; PIT.cur = '';
  PIT.msg = `Ultimo download: ${PIT.ok} gare${PIT.err ? `, ${PIT.err} errori${PIT.msg ? ' (' + PIT.msg + ')' : ''}` : ''}${PIT.stop ? ' (fermato)' : ''}.`;
  pitRefresh();
}

const RC = { running: false, stop: false, done: 0, tot: 0, cur: '', ok: 0, none: 0, err: 0, have: null };

function rcInfo() {

  if (RC.running) return `<div class="small"><b>Download in corso: ${RC.done}/${RC.tot}</b> · ${esc(RC.cur)}<div class="bar"><i style="width:${RC.tot ? RC.done / RC.tot * 100 : 0}%"></i></div><span class="mut">Circa 20 secondi per gara (OpenF1 limita le richieste). Puoi usare l'app nel frattempo, ma non chiuderla.</span></div>`;
  const last = RC.tot ? `<br>Ultimo download: ${RC.ok} gare scaricate${RC.none ? `, ${RC.none} non trovate su OpenF1` : ''}${RC.err ? `, ${RC.err} con errori` : ''}${RC.stop ? ' (fermato)' : ''}.` : '';

async function rcRefresh() { RC.have = await rcCount(); const w = $('#rcwrap'); if (w) w.innerHTML = rcInfo(); const s = $('#rcStop'); if (s) s.hidden = !RC.running; ['#rcAll', '#rcForce'].forEach(id => { const b = $(id); if (b) b.disabled = RC.running; }); }
async function rcDownloadAll(force) {
  if (RC.running) return;

  Object.assign(RC, { running: true, stop: false, done: 0, tot: todo.length, ok: 0, none: 0, err: 0, cur: '' });
  if (!todo.length) { RC.running = false; RC.tot = 0; await rcRefresh(); const w = $('#rcwrap'); if (w) w.innerHTML += '<p class="small" style="color:var(--green,#2ecc71)">Tutte le gare hanno già i dati della direzione gara.</p>'; return; }
