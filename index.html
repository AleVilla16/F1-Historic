    try { await applySnapshot(JSON.parse(await f.text())); rebuild(); $('#impmsg').textContent = 'Dati importati.'; } catch (err) { $('#impmsg').textContent = 'Errore: ' + err.message; }
  };
  $('#bSurl').onclick = async () => { SET.snapUrl = $('#surl').value.trim(); saveSet(); if (SET.snapUrl) { $('#impmsg').textContent = 'Caricamento…'; try { await loadSnapUrl(); $('#impmsg').textContent = 'Dati caricati dall\'indirizzo.'; } catch (err) { $('#impmsg').textContent = 'Errore: ' + err.message; } } };
  let armed = false;
  $('#bClr').onclick = async () => {
    if (!armed) { armed = true; $('#clrmsg').textContent = 'Premi di nuovo per confermare: tutti i dati scaricati verranno eliminati.'; return; }
    Sync.cancel = true; await Store.clear(); Object.assign(D, { seasons: {}, drivers: {}, cons: {}, circuits: {}, enrich: null, meta: { lastSync: 0 } }); rebuild(); $('#clrmsg').textContent = 'Dati eliminati.';
  };
}
// dati incorporati nell'app (data.json accanto a index.html, generato dall'azione GitHub)
async function loadEmbedded() {
  if (location.protocol === 'file:') return false;
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) return false;
    const o = await r.json();
    if (!o || !o.exportedAt || o.exportedAt === D.meta.embedAt) return false;
    await applySnapshot(o);
    D.meta.embedAt = o.exportedAt;
    D.meta.lastSync = Math.max(D.meta.lastSync || 0, Date.parse(o.exportedAt) || 0);
    await Store.set('meta', D.meta);
    return true;
  } catch (e) { return false; }
}
async function loadSnapUrl() {
  const r = await fetch(SET.snapUrl, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
  await applySnapshot(await r.json()); rebuild();
}

// ---------- modale ----------
function showModal(html) { $('#mbox').innerHTML = '<button class="x" aria-label="Chiudi">×</button>' + html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }

// ---------- sincronizzazione ----------
let rebuildT = 0;
function rebuild() { buildModel(); updateChip(); }
function startSync(opts) { if (Sync.running) return; runSync(opts).then(() => { rebuild(); route(); pumpQueue(); }); updateChip(); }
function updateChip() {
  const el = $('#chip'); if (!el) return;
  const pct = Sync.total ? Math.round(Sync.done / Sync.total * 100) : 0;
  if (Sync.running) el.innerHTML = `<span class="dot run"></span><span>${Sync.wait ? 'In pausa (limite API)' : 'Aggiornamento ' + pct + '%'}</span><span class="bar"><i style="width:${pct}%"></i></span>`;
  else if (Sync.err) el.innerHTML = `<span class="dot err"></span><span>Aggiornamento non riuscito</span>`;
  else if (!navigator.onLine) el.innerHTML = `<span class="dot err"></span><span>Offline</span>`;
  else el.innerHTML = `<span class="dot"></span><span>${D.meta.lastSync ? 'Aggiornato ' + new Date(D.meta.lastSync).toLocaleDateString('it-IT') : (Object.keys(D.seasons).length ? ((n => n === 1 ? '1 stagione' : n + ' stagioni')(Object.values(D.seasons).filter(s => s.done && s.done.res).length)) + ' con dati' : 'Nessun dato')}</span>`;
  refreshYearUI();
  const sb = $('#syncbox'); if (sb) sb.outerHTML = syncBox();
  const sw = $('#syncwrap'); if (sw && !sw.innerHTML && Sync.running) sw.innerHTML = syncBox();
}
Sync.onProgress = updateChip;
Sync.onSeason = () => {
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => {
    const wasEmpty = !M || M.empty; buildModel();
    if (wasEmpty && !M.empty && page !== 'impostazioni') route();
    else if (!M.empty && page !== 'impostazioni') $('#newdata').hidden = false;
  }, 1500);
};
// ---------- PWA ----------
const APP_VERSION = '2.40.0';
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (e) {}
  deferredPrompt = null; $('#installBtn').hidden = true; if (page === 'impostazioni') route();
}
function setupPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!isStandalone()) $('#installBtn').hidden = false; });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; $('#installBtn').hidden = true; });
  $('#installBtn').onclick = doInstall;
  window.addEventListener('online', () => { updateChip(); if (SET.auto && Date.now() - (D.meta.lastSync || 0) > 3 * 3600e3 && Object.keys(D.seasons).length) startSync({ src: SET.src, fallback: SET.fallback }); });
  window.addEventListener('offline', updateChip);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const okProto = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!('serviceWorker' in navigator) || !okProto) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => { $('#swUpd').hidden = false; $('#swUpd').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 6 * 3600e3);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
function applyTheme() { document.documentElement.dataset.theme = SET.theme; }

// ---------- avvio ----------
async function init() {
  applyTheme();
  setupPWA();
  document.body.appendChild($('#nav')); // fuori dalla barra: il backdrop-filter limiterebbe il position:fixed
  $('#nav').innerHTML = `<div class="navtop"><span class="brand"><b>F1</b> History</span><button class="menubtn navx" aria-label="Chiudi menu">✕</button></div><div class="navlist">${navHtml()}</div>`;
  { let tm; const mo = new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(() => ucTables(document.getElementById('main')), 30); }); mo.observe(document.getElementById('main'), { childList: true, subtree: true }); }
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('.modal .x') || t.id === 'modal') return closeModal();
    const tla = t.closest('[data-tlogoadd]'); if (tla) { e.preventDefault(); pickTeamLogo(tla.dataset.tlogoadd, () => route()); return; }
    const tld = t.closest('[data-tlogodel]'); if (tld) { e.preventDefault(); if (confirm('Rimuovere il logo?')) { delete TEAMLOGO[tld.dataset.tlogodel]; saveTeamLogos().then(() => route()); } return; }
    const ta = t.closest('[data-timgadd]'); if (ta) { e.preventDefault(); const [c, y] = ta.dataset.timgadd.split('|'); pickTeamImg(c, +y, () => route()); return; }
    const tbg = t.closest('[data-timgbg]'); if (tbg) { e.preventDefault(); const [c, y] = tbg.dataset.timgbg.split('|'); tbg.disabled = true; toggleTeamBg(c, +y).then(() => route()).catch(() => route()); return; }
    const tdl = t.closest('[data-timgdel]'); if (tdl) { e.preventDefault(); const [c, y] = tdl.dataset.timgdel.split('|'); delTeamImg(c, +y).then(() => route()); return; }
    const tz = t.closest('img[data-timgz]'); if (tz) { e.preventDefault(); const [c, y] = tz.dataset.timgz.split('|'); openImg(tz.src, `${cName(c)} ${y}`); return; }
    const hc = t.closest('.entrytb td[data-col]'); if (hc) { const tb = hc.closest('table'), col = hc.dataset.col, on = hc.classList.contains('cellhl');
      tb.querySelectorAll('.colhl,.rowhl,.cellhl').forEach(z => z.classList.remove('colhl', 'rowhl', 'cellhl'));
      if (!on) { tb.querySelectorAll(`[data-col="${col}"]`).forEach(z => z.classList.add('colhl')); hc.parentElement.classList.add('rowhl'); hc.classList.add('cellhl'); } return; }
    const ec = t.closest('td.editc'); if (ec && !t.closest('input')) { editCell(ec); return; }
    const tk = t.closest('[data-trk]'); if (tk) { e.preventDefault(); showTrk(tk); return; }
    const gs = t.closest('[data-gslot]'); if (gs) { const k = gs.dataset.gslot, card = gs.closest('.card'); const p = card.querySelector(`.gpanel[data-gp="${k}"]`), was = !p.hidden; card.querySelectorAll('.gpanel').forEach(z => z.hidden = true); card.querySelectorAll('.gslot.on').forEach(z => z.classList.remove('on')); if (!was) { p.hidden = false; gs.classList.add('on'); p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } return; }
    const el1 = t.closest('[data-evlink]'); if (el1) { e.preventDefault(); e.stopPropagation(); if (addEvLink(el1.dataset.evlink)) { const sp = el1.closest('.evlinks'); sp.outerHTML = evLinks(el1.dataset.evlink); } return; }
    const el2 = t.closest('[data-evlinkdel]'); if (el2) { e.preventDefault(); e.stopPropagation(); const k = el2.dataset.evlinkdel; if (confirm('Rimuovere questo link?')) { (EVL[k] || []).splice(+el2.dataset.i, 1); if (!EVL[k].length) delete EVL[k]; saveEvLinks(); el2.closest('.evlinks').outerHTML = evLinks(k); } return; }
    const ucv = t.closest('[data-ucv]'); if (ucv) { e.preventDefault(); e.stopPropagation(); ucEdit(ucv); return; }
    const ucn = t.closest('[data-ucname]'); if (ucn) { e.preventDefault(); e.stopPropagation(); const [k, id] = ucn.dataset.ucname.split('|'); if (ucMenu(k, id)) route(); return; }
    const fca = t.closest('[data-fcadd]'); if (fca) { e.preventDefault(); e.stopPropagation(); const hr = fca.closest('tr'); const labs = colLabels(hr).slice(0, -1).filter((l, i) => !hr.cells[i].classList.contains('fcth')); fcEditor(fca.dataset.fcadd, labs, () => route()); return; }
    const fce = t.closest('[data-fcedit]'); if (fce) { e.preventDefault(); e.stopPropagation(); const [k, id] = fce.dataset.fcedit.split('|'); const f = fcList(k).find(x => x.id === id); if (!f) return;
      let labs; const hr = fce.closest('tr'); if (hr && hr.closest('table')) labs = colLabels(hr).filter((l, i) => !hr.cells[i].classList.contains('fcth') && !hr.cells[i].classList.contains('ucadd')); else { const g = document.querySelector('#g'); labs = [...new Set((g && g._fcBase) || [])]; }
      fcEditor(k, labs, () => route(), f); return; }
    const uco = t.closest('[data-ucord]'); if (uco) { e.preventDefault(); e.stopPropagation(); const hr = uco.closest('tr'); const labs = colLabels(hr).slice(0, -1); openTableOrder(uco.dataset.ucord, labs); return; }
    const uca = t.closest('[data-ucadd]'); if (uca) { e.preventDefault(); e.stopPropagation(); const tb = uca.closest('table'); const kinds = ['d', 'c', 'r'].filter(kd => tb.querySelector(`tbody [data-${kd === 'r' ? 'race' : kd}]`)); ucAdd(uca.dataset.ucadd, kinds); return; }
    const sth = t.closest('table.sortt thead th'); if (sth && !sth.classList.contains('ucadd') && !t.closest('a,button')) { sortTable(sth); return; }
    const ae = t.closest('[data-addev]'); if (ae) { e.preventDefault(); const r = M.raceByKey[ae.dataset.addev]; if (r) openAddEvent(r); return; }
    const ph = t.closest('img[data-ph]'); if (ph && !t.closest('.lightbox')) { e.preventDefault(); return openPhoto(ph.dataset.ph); }
    const a = t.closest('[data-d],[data-c],[data-race]');
    if (a) {
      e.preventDefault();
      if (a.dataset.race) return openRace(a.dataset.race, a.dataset.tab);
      if (a.dataset.d) { closeModal(); return go(profHash('d', a.dataset.d)); }
      if (a.dataset.c) { closeModal(); return go(profHash('c', a.dataset.c)); }
    }
    if (t.closest('#backBtn')) return goBack();
    if (t.id === 'startSync') { startSync({ src: SET.src, fallback: SET.fallback }); route(); }
    if (t.id === 'stopSync') Sync.cancel = true;
    const ng = t.closest('[data-navgrp]'); if (ng) { const g = ng.closest('.navgrp'), o = !g.classList.contains('open'); document.querySelectorAll('nav.menu .navgrp.open').forEach(x => { if (x !== g) { x.classList.remove('open'); x.querySelector('.navgh').setAttribute('aria-expanded', 'false'); } }); g.classList.toggle('open', o); ng.setAttribute('aria-expanded', o); return; }
    if (t.closest('.navx')) { $('nav.menu').classList.remove('open'); $('#menubtn').setAttribute('aria-expanded', 'false'); document.body.classList.remove('navopen'); document.body.classList.remove('navopen'); }
    else if (t.closest('#menubtn')) { const open = $('nav.menu').classList.toggle('open'); $('#menubtn').setAttribute('aria-expanded', open); document.body.classList.toggle('navopen', open); }
    else if (!t.closest('nav.menu') && $('nav.menu').classList.contains('open')) { $('nav.menu').classList.remove('open'); $('#menubtn').setAttribute('aria-expanded', 'false'); document.body.classList.remove('navopen'); }
    if (t.closest('#chip')) go('impostazioni');
    if (t.id === 'newdata') { $('#newdata').hidden = true; route(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('nav.menu').classList.remove('open'); $('#menubtn').setAttribute('aria-expanded', 'false'); document.body.classList.remove('navopen'); } });
  window.addEventListener('hashchange', route);
  const ok = await Store.open();
  if (!ok) $('#main').insertAdjacentHTML('beforebegin', '<div class="banner" style="margin:10px">Questo browser non permette di salvare i dati (IndexedDB non disponibile): verranno riscaricati a ogni apertura.</div>');
  await loadAll();
  await loadPhotos(); await loadTeamImgs(); await loadEvLinks(); await loadTeamLogos();
  const hadData = Object.values(D.seasons).some(s => !s.manual);
  if (!hadData) {
    $('#main').innerHTML = '<h1>F1 History</h1><p class="mut">Caricamento dei dati incorporati…</p>';
    await loadEmbedded();
    if (SET.snapUrl && !Object.keys(D.seasons).length) { try { await loadSnapUrl(); } catch (e) {} }
  }
  await applySeeds();
  buildModel(); updateChip(); route();
  if (hadData && await loadEmbedded()) { buildModel(); updateChip(); if (['impostazioni', 'whatif'].includes(page)) route(); else $('#newdata').hidden = false; }
  const stale = Date.now() - (D.meta.lastSync || 0) > 3 * 3600e3;
  if (SET.auto && navigator.onLine && Object.values(D.seasons).some(s => !s.manual) && stale) startSync({ src: SET.src, fallback: SET.fallback });
}
init();

}
