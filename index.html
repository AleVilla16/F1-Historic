<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Historic</title>
<meta name="description" content="Storico completo dei risultati di Formula 1 dal 1950 a oggi">
<meta name="theme-color" content="#171a21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1 Historic">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: archivio tecnico da box F1, preciso e veloce.
IDEA: il tabellone dei tempi in pit wall: righe fitte, numeri allineati, rosso solo dove conta.
PICTURE: le tabelle stesse sono il contenuto; podio oro/argento/bronzo nelle celle.
COLOUR and TYPE: carbonio scuro, rosso F1 #e10600 come accento; Titillium Web.
LAYOUT: barra superiore con menu, contenuto a tutta larghezza, tabelle con colonne fisse.
*/
:root{--bg:#0f1115;--bg2:#171a21;--bg3:#1f232c;--line:#2a2f3a;--ink:#eef0f4;--mut:#8f97a8;--red:#e10600;--red2:#ff3b30;
--gold:#d4a017;--silver:#a9b0bb;--bronze:#b8733d;--green:#2fb37a;--blue:#4a8fe7;--purple:#9b6bd6;--rowodd:#13161c;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f7;--bg2:#ffffff;--bg3:#eceef2;--line:#d9dce3;--ink:#15171c;--mut:#5d6575;--rowodd:#f8f9fb;color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:50;padding-top:max(6px,env(safe-area-inset-top))!important;padding-left:max(14px,env(safe-area-inset-left))!important;padding-right:max(14px,env(safe-area-inset-right))!important;background:var(--bg2);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:6px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:.2px;text-decoration:none;white-space:nowrap}
.brand b{background:var(--red);color:#fff;padding:0 7px;border-radius:3px;font-style:italic}
nav.menu{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.menu a{padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--mut);font-weight:600;white-space:nowrap;font-size:14px}
nav.menu a:hover{color:var(--ink);background:var(--bg3)}
nav.menu a.on{color:#fff;background:var(--red)}
.menubtn{display:none;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.syncchip{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.syncchip .bar{width:90px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.syncchip .bar i{display:block;height:100%;background:var(--red);width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.run{background:var(--red);animation:pulse 1s infinite}.dot.err{background:#f5a623}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot.run{animation:none}}
@media(max-width:1100px){.menubtn{display:block}nav.menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg2);flex-direction:column;padding:8px;border-bottom:3px solid var(--red)}nav.menu.open{display:flex}nav.menu a{padding:12px}}
main{padding:14px max(clamp(10px,2vw,24px),env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(clamp(10px,2vw,24px),env(safe-area-inset-left))}
@media(display-mode:standalone){body{overscroll-behavior-y:none}}
h1{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:4px 0 12px}
h2{font-size:20px;margin:18px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.mut{color:var(--mut)}.small{font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px}
input[type=search],input[type=text],input[type=url],input[type=number],select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;min-height:38px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{text-decoration:none;display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;min-height:28px;font-size:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.scroll{overflow:auto;max-width:100%}
table.t{border-collapse:separate;border-spacing:0;font-size:14px;width:max-content;min-width:100%}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
table.t th{background:var(--bg3);position:sticky;top:0;z-index:2;font-weight:700;font-size:13px}
table.t tbody tr:nth-child(even) td{background:var(--rowodd)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t .fz{position:sticky;left:0;z-index:1;background:var(--bg2)}
table.t th.fz{z-index:3;background:var(--bg3)}
table.t td.team{border-left:4px solid var(--red);font-weight:700;vertical-align:top;background:var(--bg2)!important}
.lk{cursor:pointer;text-decoration:none;font-weight:600}
.lk:hover{color:var(--red2);text-decoration:underline}
/* celle risultato */
.r{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 3px;font-weight:600;font-variant-numeric:tabular-nums}
.r1{background:var(--gold);color:#111}.r2{background:var(--silver);color:#111}.r3{background:var(--bronze);color:#111}
.rp{background:color-mix(in srgb,var(--green) 30%,transparent)}.rf{background:color-mix(in srgb,var(--blue) 22%,transparent)}
.rr{background:color-mix(in srgb,var(--purple) 30%,transparent)}.rq{color:var(--mut)}.rd{background:#222;color:#fff}
sup.m{font-size:9px;margin-left:1px;font-weight:700}
.champ{color:var(--gold);font-weight:700}
/* griglia virtuale */
.vg{position:relative;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.vg-head{position:sticky;top:0;z-index:5}
.vg-hr{display:flex}
.vg-h{flex:none;background:var(--bg3);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 6px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;text-align:center}
.vg-h.fz{position:sticky;z-index:6;text-align:left}
.vg-h.grp{font-size:14px;text-align:left;padding-left:10px;background:var(--bg2);border-right:2px solid var(--red)}
.vg-h.s-asc::after{content:' ▲';color:var(--red2)}.vg-h.s-desc::after{content:' ▼';color:var(--red2)}
.vg-body{position:relative}
.vg-r{position:absolute;left:0;display:flex;width:100%}
.vg-r.odd .vg-c{background:var(--rowodd)}
.vg-r:hover .vg-c{background:var(--bg3)}
.vg-c{flex:none;padding:0 6px;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 50%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--bg2);font-size:13.5px}
.vg-c.fz{position:sticky;z-index:2;justify-content:flex-start}
.vg-c.l{justify-content:flex-start}
.vg-c.ye,.vg-h.ye{border-right:2px solid var(--red)}
.z{color:color-mix(in srgb,var(--mut) 60%,transparent)}
/* anno */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.years a{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none}
.years a:hover{border-color:var(--red)}
.years b{font-size:22px;display:block;line-height:1.1}
.years span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;background:var(--bg3);color:var(--mut)}
.tag.title{background:var(--gold);color:#111}.tag.win{background:var(--red);color:#fff}.tag.team{background:var(--blue);color:#fff}.tag.pole{background:var(--purple);color:#fff}.tag.pod{background:var(--bronze);color:#111}.tag.rec{background:var(--green);color:#111}
/* modale */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;max-width:1100px;width:100%;padding:16px 18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;font-size:26px;background:none;border:0;cursor:pointer;color:var(--mut);width:44px;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--bg3);border-radius:8px;padding:6px 10px;text-align:center;min-width:70px}
.chip b{display:block;font-size:20px;line-height:1.1}.chip span{font-size:11px;color:var(--mut)}
.banner{background:color-mix(in srgb,var(--red) 14%,var(--bg2));border:1px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.prog{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--red)}
.era{border-left:4px solid var(--red)}
.era ul{margin:6px 0 0;padding-left:20px}
.diff-up{color:var(--green);font-weight:700}.diff-dn{color:var(--red2);font-weight:700}
tr.changed td{background:color-mix(in srgb,var(--gold) 14%,transparent)!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){table.t{font-size:13px}main{padding:10px 8px}}

.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.yb{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:8px 4px;font-weight:700;cursor:pointer;min-height:44px;font-variant-numeric:tabular-nums}
.yb i{position:absolute;top:2px;right:5px;font-style:normal;font-size:11px}
.yb.ok{border-color:var(--green)}.yb.ok i{color:var(--green)}
.yb.partial{border-color:#f5a623}.yb.partial i{color:#f5a623}
.yb.missing{color:var(--mut)}
.yb.queued{border-style:dashed;border-color:var(--red)}
.yb.run{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
.yb:hover{border-color:var(--ink)}
.ylegend{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ys{display:inline-block;width:22px;text-align:center;border:1px solid var(--line);border-radius:5px;font-weight:700}
.ys.ok{border-color:var(--green);color:var(--green)}.ys.partial{border-color:#f5a623;color:#f5a623}.ys.queued{border:1px dashed var(--red)}
.years a.nodata{opacity:.6;border-style:dashed}
@media(prefers-reduced-motion:reduce){.yb.run{animation:none}}
.yb.alt{outline:2px dashed var(--blue);outline-offset:-4px}

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#albo-piloti"><b>F1</b> Historic</a>
  <button class="menubtn" id="menubtn" aria-label="Apri menu">Menu ▾</button>
  <nav class="menu" id="nav"></nav>
  <button class="btn sm pri" id="installBtn" hidden>Installa app</button>
  <button class="btn sm pri" id="swUpd" hidden>Nuova versione: aggiorna</button>
  <button class="btn sm" id="newdata" hidden>Nuovi dati: aggiorna vista</button>
  <div class="syncchip" id="chip" title="Stato dei dati"></div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
'use strict';
{
// ===================== REGOLAMENTI (contenuto statico) =====================
const REG_ERAS = [
  {from:1950,to:1953,title:'Le origini',items:[
    'Motori: 4,5 L aspirati o 1,5 L sovralimentati (1950–51). Nel 1952–53 il Mondiale si corre con vetture di Formula 2 (2,0 L aspirati / 0,75 L sovralimentati).',
    'Punti: 8-6-4-3-2 ai primi cinque + 1 punto al giro più veloce.',
    'Contano solo i migliori 4 risultati della stagione.',
    'Auto condivise: i punti vengono divisi tra i piloti che si alternano alla guida.',
    'La 500 Miglia di Indianapolis è valida per il Mondiale piloti (fino al 1960).']},
  {from:1954,to:1960,title:'Formula 2,5 litri',items:[
    'Motori: 2,5 L aspirati o 0,75 L sovralimentati.',
    'Punti: 8-6-4-3-2 + 1 al giro veloce (1954–59); nel 1960 8-6-4-3-2-1 senza punto per il giro veloce.',
    'Migliori 5 risultati validi (1954–57), migliori 6 (1958–60).',
    '1958: nasce la Coppa Costruttori; obbligo di benzina avio al posto delle miscele ad alcol; nessun punto per le auto condivise.']},
  {from:1961,to:1965,title:'Formula 1,5 litri',items:[
    'Motori: 1,5 L aspirati (minimo 1,3 L), senza sovralimentazione; peso minimo 450 kg.',
    'Punti: 9-6-4-3-2-1 (la vittoria passa da 8 a 9 punti).',
    'Migliori 5 risultati validi (1961–62), migliori 6 (1963–65).',
    'Obbligatori motorino d\'avviamento, roll-bar e doppio circuito frenante.']},
  {from:1966,to:1976,title:'Formula 3 litri',items:[
    'Motori: 3,0 L aspirati o 1,5 L sovralimentati.',
    'Punti: 9-6-4-3-2-1.',
    'Scarti: nel 1966 migliori 5; dal 1967 la stagione è divisa in due metà e si contano i migliori risultati di ciascuna.',
    '1968: arrivano gli sponsor commerciali e i primi alettoni.',
    'Anni \'70: cinture, estintori, serbatoi deformabili e strutture di sicurezza diventano obbligatori.']},
  {from:1977,to:1988,title:'Effetto suolo e turbo',items:[
    '1977: Renault porta in pista il primo motore turbo 1,5 L; Lotus introduce l\'effetto suolo con le minigonne.',
    'Punti: 9-6-4-3-2-1; dal 1981 contano i migliori 11 risultati.',
    '1981–82: minigonne mobili vietate e altezza minima da terra; 1983: obbligo di fondo piatto.',
    '1984: rifornimenti in gara vietati, limite di 220 L di carburante (195 L dal 1986).',
    '1986: solo motori turbo 1,5 L; 1987–88 turbo limitati (valvola pop-off a 4,0 e poi 2,5 bar) affiancati dai 3,5 L aspirati.']},
  {from:1989,to:1994,title:'Aspirati 3,5 litri ed elettronica',items:[
    'Motori: solo 3,5 L aspirati, turbo banditi.',
    'Punti: 9-6-4-3-2-1 con migliori 11 risultati fino al 1990; dal 1991 10-6-4-3-2-1 e contano tutti i risultati.',
    'Inizio anni \'90: sospensioni attive, controllo di trazione e cambi semiautomatici; gran parte degli aiuti elettronici vietati nel 1994.',
    '1993: safety car introdotta stabilmente; 1994: tornano i rifornimenti in gara.',
    'Dopo Imola 1994: nuove misure di sicurezza (tavola sotto il fondo, meno carico aerodinamico).']},
  {from:1995,to:2005,title:'Motori 3 litri',items:[
    'Motori: 3,0 L aspirati (dal 2000 obbligatori i V10).',
    'Punti: 10-6-4-3-2-1 fino al 2002; dal 2003 10-8-6-5-4-3-2-1.',
    '1998: vetture più strette (1,8 m) e gomme scanalate.',
    '2003: qualifica a giro singolo e parco chiuso tra qualifica e gara.',
    '2004: un motore per weekend; 2005: un motore ogni due GP e un solo treno di gomme per qualifica e gara.']},
  {from:2006,to:2013,title:'V8 2,4 litri',items:[
    'Motori: V8 2,4 L aspirati, sviluppo congelato dal 2007.',
    '2006: qualifica a eliminazione Q1-Q2-Q3.',
    '2007: fornitore unico di gomme (Bridgestone), dal 2011 Pirelli.',
    '2009: gomme slick, aerodinamica semplificata e KERS.',
    '2010: punti 25-18-15-12-10-8-6-4-2-1; rifornimenti vietati.',
    '2011: introdotto il DRS (ala posteriore mobile).']},
  {from:2014,to:2021,title:'Era ibrida turbo',items:[
    'Power unit: V6 1,6 L turbo ibrido con MGU-K e MGU-H, massimo 100 kg di carburante a gara.',
    'Punti: 25-18-15-12-10-8-6-4-2-1; nel 2014 punti doppi all\'ultima gara.',
    '2017: vetture e gomme più larghe; 2018: Halo obbligatorio.',
    '2019–2024: 1 punto per il giro più veloce, se il pilota arriva nei primi 10.',
    '2021: budget cap e prime gare Sprint (3-2-1 punti ai primi tre).']},
  {from:2022,to:2025,title:'Ritorno dell\'effetto suolo',items:[
    'Vetture a effetto suolo con fondo Venturi e cerchi da 18".',
    'Sprint: punti 8-7-6-5-4-3-2-1 ai primi otto.',
    '2023: Sprint Shootout per la griglia della Sprint; 2024: Sprint Qualifying.',
    '2025: abolito il punto per il giro più veloce.']},
  {from:2026,to:null,title:'Nuova generazione 2026',items:[
    'Power unit: V6 1,6 L turbo con circa metà della potenza elettrica (MGU-K fino a 350 kW), MGU-H eliminato, carburanti 100% sostenibili.',
    'Vetture più piccole e leggere, aerodinamica attiva al posto del DRS.',
    'Punti: 25-18-15-12-10-8-6-4-2-1; Sprint 8-7-6-5-4-3-2-1.']},
];
const YEAR_NOTES = {
  1950:['Primo Campionato del Mondo di Formula 1: 7 gare, compresa la 500 Miglia di Indianapolis.'],
  1958:['Prima edizione della Coppa Costruttori, vinta da Vanwall.'],
  1961:['Debutto della formula 1,5 litri.'],
  1966:['Raddoppio della cilindrata a 3 litri.'],
  1977:['Debutto del motore turbo (Renault RS01).'],
  1983:['Obbligo di fondo piatto: fine dell\'effetto suolo con minigonne.'],
  1989:['Turbo vietati: solo motori aspirati 3,5 L.'],
  1991:['La vittoria vale 10 punti e contano tutti i risultati.'],
  1994:['Ritorno dei rifornimenti; vietati controllo di trazione e sospensioni attive.'],
  2003:['Nuovo sistema di punti ai primi 8 e qualifica a giro singolo.'],
  2006:['Motori V8 e qualifica a eliminazione.'],
  2009:['Slick, KERS e aerodinamica rivoluzionata.'],
  2010:['Rifornimenti vietati; nuovo sistema di punti 25-18-15…'],
  2014:['Debutto delle power unit ibride turbo; punti doppi ad Abu Dhabi.'],
  2017:['Vetture più larghe e veloci.'],
  2018:['Halo obbligatorio.'],
  2019:['Torna il punto per il giro più veloce.'],
  2021:['Prime gare Sprint e budget cap; GP del Belgio assegna metà punti.'],
  2022:['Ritorno delle vetture a effetto suolo.'],
  2025:['Abolito il punto per il giro più veloce.'],
  2026:['Nuove power unit con metà potenza elettrica e aerodinamica attiva.'],
};
function eraOf(y){ return REG_ERAS.find(e=>y>=e.from && (e.to==null || y<=e.to)); }

const POINT_PRESETS = [
  {id:'p2010',l:'2010–oggi: 25-18-15-12-10-8-6-4-2-1',pts:[25,18,15,12,10,8,6,4,2,1],fl:0},
  {id:'p2019',l:'2019–24: 25-18-15… + 1 giro veloce (top 10)',pts:[25,18,15,12,10,8,6,4,2,1],fl:1,flTop:10},
  {id:'p2003',l:'2003–09: 10-8-6-5-4-3-2-1',pts:[10,8,6,5,4,3,2,1],fl:0},
  {id:'p1991',l:'1991–2002: 10-6-4-3-2-1',pts:[10,6,4,3,2,1],fl:0},
  {id:'p1961',l:'1961–90: 9-6-4-3-2-1',pts:[9,6,4,3,2,1],fl:0},
  {id:'p1960',l:'1960: 8-6-4-3-2-1',pts:[8,6,4,3,2,1],fl:0},

// ===================== DATI: API, CACHE, MODELLO =====================
const API = 'https://api.jolpi.ca/ergast/f1';
const FIRST_YEAR = 1950;

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- IndexedDB ----------
const Store = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('f1-historic', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  _tx(mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(undefined);
      const t = this.db.transaction('kv', mode), rq = fn(t.objectStore('kv'));
      t.oncomplete = () => res(rq ? rq.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  get(k) { return this._tx('readonly', s => s.get(k)); },
  set(k, v) { return this._tx('readwrite', s => s.put(v, k)); },
  del(k) { return this._tx('readwrite', s => s.delete(k)); },
  clear() { return this._tx('readwrite', s => s.clear()); },
  entries() {
    return new Promise((res, rej) => {
      if (!this.db) return res([]);
      const t = this.db.transaction('kv', 'readonly'), st = t.objectStore('kv');
      const a = st.getAllKeys(), b = st.getAll();
      t.oncomplete = () => res(a.result.map((k, i) => [k, b.result[i]]));
      t.onerror = () => rej(t.error);
    });
  }
};

// ---------- stato grezzo ----------
const D = { seasons: {}, drivers: {}, cons: {}, circuits: {}, enrich: null, meta: { lastSync: 0 } };

async function loadAll() {
  for (const [k, v] of await Store.entries()) {
    if (k.startsWith('season:')) D.seasons[v.year] = v;
    else if (k === 'drivers') D.drivers = v;
    else if (k === 'cons') D.cons = v;
    else if (k === 'circuits') D.circuits = v;
    else if (k === 'enrich') D.enrich = v;
    else if (k === 'meta') D.meta = v;
  }
}
async function saveMasters() {

  await Store.set('circuits', D.circuits); await Store.set('meta', D.meta);

// ---------- rete con limiti di frequenza ----------
const Sync = { running: false, cancel: false, msg: '', wait: '', done: 0, total: 0, req: 0, err: null, onProgress: () => {}, onSeason: () => {} };
const Net = { last: 0, gap: (typeof process !== 'undefined' && process.env && +process.env.F1_GAP) || 320 };

async function waitMsg(ms, txt) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    if (Sync.cancel) throw new Error('Download interrotto');
    Sync.wait = `${txt} tra ${Math.ceil((end - Date.now()) / 1000)} s`;
    Sync.onProgress(); await sleep(1000);
  }
  Sync.wait = ''; Sync.onProgress();
}
async function apiGet(path, opt = {}) {
  const full = /^https?:/.test(path) ? path : API + path;
  let attempt = 0;
  for (;;) {
    if (Sync.cancel) throw new Error('Download interrotto');
    const w = Net.last + Net.gap - Date.now(); if (w > 0) await sleep(w);
    Net.last = Date.now();
    let r;
    try { r = await fetch(full, { headers: { Accept: 'application/json' } }); }
    catch (e) {
      attempt++; if (attempt > 5) throw new Error('API non raggiungibile (controlla la connessione)');
      await waitMsg(4000 * attempt, 'Errore di rete, nuovo tentativo'); continue;
    }
    Sync.req++;
    if (r.status === 429) {
      attempt++;
      const ra = +(r.headers.get('Retry-After') || 0) * 1000;
      await waitMsg(Math.max(ra, Math.min(60000 * attempt, 300000)), 'Limite richieste dell\'API raggiunto, riprendo');
      continue;
    }
    if (r.status >= 500) {
      attempt++; if (attempt > 5) throw new Error('Server API non disponibile (' + r.status + ')');
      await waitMsg(5000 * attempt, 'Server non disponibile, riprovo'); continue;
    }
    if (opt.allow404 && (r.status === 404 || r.status === 400)) return null;
    if (!r.ok) throw new Error('Errore HTTP ' + r.status + ' su ' + full);
    const j = await r.json();
    return opt.raw ? j : j.MRData;
  }
}
async function pagedAll(path, extract) {

  while (off < total) {
    const m = await apiGet(`${path}${path.includes('?') ? '&' : '?'}limit=100&offset=${off}`);
    total = +m.total || 0; out.push(...(extract(m) || [])); off += 100;
  }

}
function mergeRaces(list, key) {
  const by = {};
  for (const R of list) {
    if (!by[R.round]) by[R.round] = Object.assign({}, R, { [key]: [] });
    by[R.round][key].push(...(R[key] || []));
  }
  return Object.values(by);
}

// ---------- conversione ----------
function ingDriver(x) {

  D.drivers[x.driverId] = { id: x.driverId, gn: x.givenName, fn: x.familyName, dob: x.dateOfBirth || '', nat: x.nationality || '', code: x.code || '', pn: x.permanentNumber || '', url: x.url || '' };
}

  const r = s.races[R.round] || (s.races[R.round] = { round: +R.round });
  r.name = R.raceName; r.date = R.date; r.time = R.time || ''; r.url = R.url || '';
  if (R.Sprint) r.sprintDate = R.Sprint.date;
  const C = R.Circuit;
  if (C) {
    r.circ = C.circuitId;
    D.circuits[C.circuitId] = { id: C.circuitId, name: C.circuitName, loc: C.Location?.locality || '', country: C.Location?.country || '', lat: C.Location?.lat, long: C.Location?.long, url: C.url || '' };
  }
}
const num = v => (v === undefined || v === null || v === '') ? null : +v;
function convRes(x) {
  ingDriver(x.Driver); ingCons(x.Constructor);
  const f = x.FastestLap;
  return { d: x.Driver.driverId, c: x.Constructor.constructorId, n: x.number || '', p: num(x.position), pt: x.positionText || '', g: num(x.grid),
    l: +x.laps || 0, s: x.status || '', pts: +x.points || 0, t: x.Time?.time || '',

}
function convQ(x) {
  ingDriver(x.Driver); ingCons(x.Constructor);
  return { d: x.Driver.driverId, c: x.Constructor.constructorId, n: x.number || '', p: num(x.position), q1: x.Q1 || '', q2: x.Q2 || '', q3: x.Q3 || '' };
}
const newSeason = y => ({ year: y, races: {}, res: {}, spr: {}, q: {}, dst: [], cst: [], done: {}, fetchedAt: 0, final: false });

async function syncSeason(y, what) {
  const s = D.seasons[y] || (D.seasons[y] = newSeason(y));
  if (what.sched) {
    const races = await pagedAll(`/${y}.json`, m => m.RaceTable?.Races);
    races.forEach(R => ingRace(s, R)); s.done.sched = true;
  }
  if (what.res) {
    const races = mergeRaces(await pagedAll(`/${y}/results.json`, m => m.RaceTable?.Races), 'Results');
    s.res = {};

    s.done.res = true;
  }
  if (what.spr && y >= 2021) {
    const races = mergeRaces(await pagedAll(`/${y}/sprint.json`, m => m.RaceTable?.Races), 'SprintResults');
    s.spr = {};

  if (what.st) {

    s.dst = L.flatMap(l => l.DriverStandings || []).map(x => {
      ingDriver(x.Driver);
      return { d: x.Driver.driverId, p: num(x.position), pt: x.positionText || '', pts: +x.points || 0, w: +x.wins || 0, cs: (x.Constructors || []).map(c => { ingCons(c); return c.constructorId; }) };

        ingCons(x.Constructor);
        return { c: x.Constructor.constructorId, p: num(x.position), pt: x.positionText || '', pts: +x.points || 0, w: +x.wins || 0 };

  if (what.q && y >= 1994) {

    s.q = {};
    for (const R of races) { ingRace(s, R); s.q[R.round] = R.QualifyingResults.map(convQ); }

  }

  await Store.set('season:' + y, s);
  await saveMasters();
}

async function runSync(opts = {}) {
  if (Sync.running) return;
  Object.assign(Sync, { running: true, cancel: false, err: null, done: 0, req: 0, wait: '' });
  Sync.onProgress();
  try {
    const tasks = [];
    if (opts.years) {
      const ys = [...new Set(opts.years)].sort((x, z) => z - x);
      for (const y of ys) { tasks.push({ y, ph: 1 }); if (y >= 1994) tasks.push({ y, ph: 2 }); }
    } else for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) {
      const s = D.seasons[y];
      if (opts.full || !s || !s.final || !(s.done && s.done.res && s.done.st)) tasks.push({ y, ph: 1 });
    }
    if (!opts.years) for (let y = CUR_YEAR; y >= 1994; y--) {
      const s = D.seasons[y];
      if (opts.full || !s || !s.final || !(s.done && s.done.q)) tasks.push({ y, ph: 2 });
    }
    if (opts.src === 'f1api') { for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].ph === 2) tasks.splice(i, 1); }
    Sync.total = tasks.length; Sync.years = opts.years ? tasks.map(t => t.y) : null; Sync.src = opts.src || 'jolpica';
    for (const t of tasks) {
      Sync.msg = opts.src === 'f1api' ? `Stagione ${t.y} da f1api.dev` : t.ph === 1 ? `Stagione ${t.y}: risultati e classifiche` : `Stagione ${t.y}: qualifiche`;
      Sync.cur = t.y; Sync.onProgress();
      if (opts.src === 'f1api') await syncSeasonF1A(t.y);
      else if (t.ph === 1) { await syncSeason(t.y, { sched: t.y >= CUR_YEAR, res: 1, spr: 1, st: 1 }); D.seasons[t.y].src = 'jolpica'; }
      else await syncSeason(t.y, { q: 1 });
      Sync.done++; Sync.onProgress(); Sync.onSeason(t.y);
    }
    if (!opts.years) { D.meta.lastSync = Date.now(); await Store.set('meta', D.meta); }
    Sync.msg = 'Dati aggiornati';
  } catch (e) { Sync.err = e.message; Sync.msg = ''; }
  finally { Sync.running = false; Sync.wait = ''; Sync.cur = null; Sync.onProgress(); }
}

  if (!o || !['f1-historic', 'f1-storico'].includes(o.format)) throw new Error('File non riconosciuto: serve un export di questa app');
  for (const [y, s] of Object.entries(o.seasons || {})) {

  }

      if (fr && (!cfg.flTop || (isNum(fr) && fr.p <= cfg.flTop))) { per[race.fl.d] = (per[race.fl.d] || 0) + cfg.fl; C_(fr.c).pts += cfg.fl; }
    }
    for (const [d, p] of Object.entries(per)) D_(d).scores.push(p);
    if (race.spr.length && cfg.sprint !== 'none') {
      for (const x of race.spr) {
        const p = cfg.sprint === 'real' ? x.pts : (isNum(x) ? (cfg.sprint[x.p - 1] || 0) : 0);
        D_(x.d).spr += p; C_(x.c).pts += p;
      }
    }
  }
  const cb = (a, b) => { for (let p = 1; p <= 40; p++) { const d = (b.cnt[p] || 0) - (a.cnt[p] || 0); if (d) return d; } return 0; };
  const dl = Object.values(drv).map(o => {
    const s = o.scores.slice().sort((a, b) => b - a);
    const used = cfg.best > 0 ? s.slice(0, cfg.best) : s;
    o.tot = used.reduce((a, b) => a + b, 0) + o.spr;
    const real = yi.dst.find(e => e.d === o.id); o.realPos = real ? real.p : null; o.realPts = real ? real.pts : null;
    return o;
  }).sort((a, b) => b.tot - a.tot || cb(a, b));
  dl.forEach((o, i) => o.pos = i + 1);
  const cl = Object.values(con).map(o => { const real = yi.cst.find(e => e.c === o.id); o.tot = o.pts; o.realPos = real ? real.p : null; o.realPts = real ? real.pts : null; return o; })
    .sort((a, b) => b.tot - a.tot || cb(a, b));
  cl.forEach((o, i) => o.pos = i + 1);
  return { drivers: dl, cons: cl };
}

function dName(d) { const x = D.drivers[d]; return x ? `${x.gn} ${x.fn}` : d; }

function dAbbr(d) { const x = D.drivers[d]; return x ? (x.code || normName(x.fn).slice(0, 3).toUpperCase()) : ''; }
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function ageAt(dob, iso) {
  if (!dob || !iso) return null;
  const [a, b, c] = dob.split('-').map(Number), [x, y, z] = iso.split('-').map(Number);
  return x - a - ((y < b || (y === b && z < c)) ? 1 : 0);
}

// ---------- griglia virtuale (righe e colonne) ----------
function vgrid(host, cols, rows, cellFn, o = {}) {
  const rowH = o.rowH || 32, fz = o.frozen || 0;
  const xs = []; let W = 0; for (const c of cols) { xs.push(W); W += c.w; }
  const fzW = fz ? xs[fz - 1] + cols[fz - 1].w : 0;
  let gh = '';
  if (cols.some(c => c.g)) {
    const groups = [];
    for (let i = fz; i < cols.length; i++) { const g = groups[groups.length - 1]; if (g && g.g === cols[i].g) g.w += cols[i].w; else groups.push({ g: cols[i].g, w: cols[i].w, a: cols[i].ga || '' }); }
    gh = `<div class="vg-hr">${fz ? `<div class="vg-h fz grp" style="width:${fzW}px;left:0"></div>` : ''}${groups.map(g => `<div class="vg-h grp" style="width:${g.w}px" ${g.a}>${g.g}</div>`).join('')}</div>`;
  }
  const lh = `<div class="vg-hr">${cols.map((c, i) => `<div class="vg-h ${i < fz ? 'fz' : ''} ${c.cls || ''} ${o.sortCi === i ? 's-' + o.sortDir : ''}" data-ci="${i}" style="width:${c.w}px;${i < fz ? `left:${xs[i]}px` : ''}" title="${esc(c.t || c.l)}">${c.l}</div>`).join('')}</div>`;
  host.innerHTML = `<div class="vg"><div class="vg-head" style="width:${W}px">${gh}${lh}</div><div class="vg-body" style="width:${W}px;height:${Math.max(rows.length * rowH, 1)}px"></div></div>${rows.length ? '' : '<p class="mut">Nessun risultato.</p>'}`;
  const sc = host.firstElementChild, head = sc.firstElementChild, body = sc.lastElementChild;
  let last = '';
  const size = () => { const top = sc.getBoundingClientRect().top; sc.style.height = Math.max(320, window.innerHeight - top - 14) + 'px'; };
  function render() {
    const st = Math.max(0, sc.scrollTop - head.offsetHeight), h = sc.clientHeight;
    const r0 = Math.max(0, Math.floor(st / rowH) - 4), r1 = Math.min(rows.length - 1, Math.ceil((st + h) / rowH) + 4);
    const L = sc.scrollLeft + fzW, R = sc.scrollLeft + sc.clientWidth;
    let c0 = fz; while (c0 < cols.length - 1 && xs[c0] + cols[c0].w < L) c0++;
    let c1 = c0; while (c1 < cols.length - 1 && xs[c1 + 1] < R) c1++;
    c0 = Math.max(fz, c0 - 2); c1 = Math.min(cols.length - 1, c1 + 2);
    const sig = `${r0}|${r1}|${c0}|${c1}`; if (sig === last) return; last = sig;
    let html = '';
    for (let i = r0; i <= r1; i++) {
      const row = rows[i];
      html += `<div class="vg-r${i % 2 ? ' odd' : ''}" style="top:${i * rowH}px;height:${rowH}px">`;
      for (let j = 0; j < fz; j++) html += `<div class="vg-c fz ${cols[j].cls || ''}" style="width:${cols[j].w}px;left:${xs[j]}px">${cellFn(row, j, i)}</div>`;
      html += `<div style="flex:none;width:${xs[c0] - fzW}px"></div>`;
      for (let j = c0; j <= c1; j++) html += `<div class="vg-c ${cols[j].cls || ''}" style="width:${cols[j].w}px">${cellFn(row, j, i)}</div>`;
      html += '</div>';
    }
    body.innerHTML = html;
  }
  let raf = 0;
  sc.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); });
  head.addEventListener('click', e => { const yr = e.target.closest('[data-yr]'); if (yr) return go('anno-' + yr.dataset.yr); const h = e.target.closest('[data-ci]'); if (h && o.onHead) o.onHead(+h.dataset.ci); });
  size(); render();
  if (window._vgRO) window._vgRO.disconnect();
  const ro = new ResizeObserver(() => { if (!sc.isConnected) return ro.disconnect(); size(); last = ''; render(); }); ro.observe(document.body); window._vgRO = ro;
  if (o.keepScroll) { sc.scrollLeft = o.keepScroll[0]; sc.scrollTop = o.keepScroll[1]; }
  return sc;
}
// tabella ordinabile su griglia virtuale
function sortableGrid(host, cols, baseRows, o) {
  let sortCi = o.sortCi, dir = o.sortDir || 'desc', sc = null;
  const draw = () => {
    const c = cols[sortCi]; let rows = baseRows.slice();
    if (c && c.v) {
      const m = dir === 'asc' ? 1 : -1;
      rows.sort((a, b) => {
        let x = c.v(a), y = c.v(b);
        const nx = x == null || x === '', ny = y == null || y === '';
        if (nx && ny) return 0; if (nx) return 1; if (ny) return -1;
        return (typeof x === 'string' ? x.localeCompare(y) : x - y) * m || (o.tie ? o.tie(a, b) : 0);
      });
    }
    sc = vgrid(host, cols, rows, (r, j, i) => cols[j].f(r, i), { frozen: o.frozen, sortCi, sortDir: dir, rowH: o.rowH,
      onHead: ci => { if (!cols[ci].v) return; if (ci === sortCi) dir = dir === 'asc' ? 'desc' : 'asc'; else { sortCi = ci; dir = cols[ci].asc ? 'asc' : 'desc'; } draw(); } });
  };
  draw();
}

    rows.map(x => `<tr><td class="n"><b>${ptxt(x)}</b></td><td class="c">${esc(x.n)}</td><td>${dl(x.d)}</td><td>${cl(x.c)}</td><td class="n">${x.l}</td><td>${esc(x.t || x.s)}</td><td class="n">${x.g === 0 ? 'Box' : (x.g ?? '')}</td><td class="n">${x.pts ? fmtPts(x.pts) : ''}</td></tr>`)) : '<p class="mut">Risultati non disponibili.</p>';
  const gridTbl = rows => { const g = rows.filter(x => x.g != null && isStart(x)).sort((a, b) => (a.g || 999) - (b.g || 999)); return g.length ? tbl([['Pos.', 'n'], ['N°', 'c'], ['Pilota'], ['Scuderia']], g.map(x => `<tr><td class="n"><b>${x.g || 'Box'}</b></td><td class="c">${esc(x.n)}</td><td>${dl(x.d)}</td><td>${cl(x.c)}</td></tr>`)) : '<p class="mut">Griglia non disponibile.</p>'; };
  const flTbl = (rows, fb) => {
    const f = rows.filter(x => x.fl && x.fl.t).sort((a, b) => (a.fl.r || 999) - (b.fl.r || 999) || lapMs(a.fl.t) - lapMs(b.fl.t));
    if (f.length) return tbl([['Pos.', 'n'], ['Pilota'], ['Scuderia'], ['Giro', 'n'], ['Tempo']], f.map((x, i) => `<tr><td class="n"><b>${i + 1}</b></td><td>${dl(x.d)}</td><td>${cl(x.c)}</td><td class="n">${x.fl.lap ?? ''}</td><td>${esc(x.fl.t)}</td></tr>`));
    if (fb) return `<p>Giro più veloce: ${who(fb, fb.t)}${fb.lap ? ` (giro ${fb.lap})` : ''}</p><p class="mut small">La classifica completa dei giri veloci è disponibile dal 2004.</p>`;
    return '<p class="mut">Dati sui giri veloci non disponibili per questa gara (disponibili dal 2004, o con l\'import F1DB).</p>';
  };
  if (tab === 'q') {
    body = r.q.length ? tbl([['Pos.', 'n'], ['N°', 'c'], ['Pilota'], ['Scuderia'], ['Q1'], ['Q2'], ['Q3']].concat(r.q.some(x => x.t) ? [['Tempo']] : []),
      r.q.slice().sort((a, b) => (a.p || 999) - (b.p || 999)).map(x => `<tr><td class="n"><b>${x.p ?? ''}</b></td><td class="c">${esc(x.n)}</td><td>${dl(x.d)}</td><td>${x.c ? cl(x.c) : ''}</td><td>${esc(x.q1)}</td><td>${esc(x.q2)}</td><td>${esc(x.q3)}</td>${r.q.some(z => z.t) ? `<td>${esc(x.t)}</td>` : ''}</tr>`))
      : '<p class="mut">Qualifiche non disponibili per questa gara: l\'API le fornisce dal 1994. Per gli anni precedenti importa F1DB in Impostazioni; nel frattempo vedi la griglia di partenza.</p>';
  } else if (tab === 'grid') body = gridTbl(r.res);
  else if (tab === 'res') body = resTbl(r.res);
  else if (tab === 'fl') body = flTbl(r.res, r.fl);
  else if (tab === 'sgrid') body = gridTbl(r.spr);
  else if (tab === 'spr') body = resTbl(r.spr);
  else if (tab === 'sfl') body = flTbl(r.spr, r.sFl);
  showModal(head + body);
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => openRace(key, b.dataset.rt));
}

function topBy(races, k, what = 'win') {
  const o = {};

  return Object.entries(o).sort((a, b) => b[1] - a[1]);
}

        const ch = nw && real && nw.id !== real.d, chc = nc && realC && nc.id !== realC.c; if (ch) changes++;

  main.querySelectorAll('select,input').forEach(e => e.addEventListener('change', rd));
  $('#wc').addEventListener('input', rd); rd();
}

// ---------- download anno per anno ----------
let yearQueue = [];
function yearStatus(y) {
  const s = D.seasons[y];
  if (!s || !s.done || !s.done.res) return 'missing';
  const ok = s.done.st && (y < 2021 || s.done.spr) && (y < 1994 || s.done.q);
  return ok ? 'ok' : 'partial';
}
const yearOpts = sel => { let h = ''; for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) h += `<option ${y === sel ? 'selected' : ''}>${y}</option>`; return h; };
function yearGrid() {
  let h = '';
  for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) {
    const running = Sync.running && Sync.cur === y, queued = yearQueue.includes(y) || (Sync.running && Sync.years && Sync.years.includes(y) && !running && yearStatus(y) !== 'ok');
    const st = running ? 'run' : queued ? 'queued' : yearStatus(y);
    const s = D.seasons[y];
    const tip = st === 'ok' ? `Scaricata da ${s.src === 'f1api' ? 'f1api.dev' : 'Jolpica'} il ${new Date(s.fetchedAt).toLocaleString('it-IT')}. Tocca per riscaricare.` : st === 'partial' ? 'Scaricata in parte: tocca per completare' : st === 'run' ? 'Download in corso' : st === 'queued' ? 'In coda' : 'Tocca per scaricare';
    h += `<button class="yb ${st}${s && s.src === 'f1api' ? ' alt' : ''}" data-y="${y}" title="${tip}">${y}<i>${{ ok: '✓', partial: '~', missing: '·', run: '↓', queued: '…' }[st]}</i></button>`;
  }
  return h;
}
function srcNote() {
  return SET.src === 'f1api'
    ? '<b>f1api.dev</b>: API gratuita e open source con dati dal 1950. Una gara alla volta (circa 50 richieste per stagione moderna). Limiti noti: mancano le Sprint 2021–2023, i giri completati e i non classificati; i giri veloci sono solo per pilota. Le stagioni scaricate da qui sono segnate con il bordo tratteggiato blu.'
    : '<b>Jolpica-F1</b>: erede di Ergast, dati completi dal 1950 (qualifiche dal 1994, giri veloci dal 2004). Da 3 a 12 richieste per stagione, limite 500 richieste all\'ora.';
}
function queueInfo() {
  if (Sync.running) return `In download: ${Sync.cur || ''} ${Sync.wait ? '· ' + esc(Sync.wait) : ''}${yearQueue.length ? ` · in coda: ${yearQueue.length} stagioni` : ''}`;
  const n = Array.from({ length: CUR_YEAR - FIRST_YEAR + 1 }, (_, i) => FIRST_YEAR + i).filter(y => yearStatus(y) === 'ok').length;
  return `${n} stagioni complete su ${CUR_YEAR - FIRST_YEAR + 1}.${Sync.err ? ' Ultimo errore: ' + esc(Sync.err) : ''}`;
}
function refreshYearUI() { const g = $('#ygrid'); if (g) g.innerHTML = yearGrid(); const q = $('#qinfo'); if (q) q.innerHTML = queueInfo(); }
function queueYears(ys) {
  for (const y of ys) if (!yearQueue.includes(y) && !(Sync.running && Sync.cur === y)) yearQueue.push(y);
  refreshYearUI(); pumpQueue();
}
function pumpQueue() {
  if (Sync.running || !yearQueue.length) return;
  const ys = yearQueue.splice(0, yearQueue.length);
  runSync({ years: ys, src: SET.src }).then(() => { rebuild(); refreshYearUI(); if (page === 'impostazioni' || /^anno/.test(page)) route(); else $('#newdata').hidden = false; pumpQueue(); });
  updateChip(); refreshYearUI();
}

  <div class="card"><h2 style="margin-top:0">Dati</h2>
   <p>Stagioni presenti: <b>${n}</b> su ${tot} (${fin} definitive) · Ultimo aggiornamento: <b>${D.meta.lastSync ? new Date(D.meta.lastSync).toLocaleString('it-IT') : 'mai'}</b>${D.meta.embedAt ? ` · Dati incorporati del <b>${new Date(D.meta.embedAt).toLocaleString('it-IT')}</b>` : ''}</p>
   <p class="small mut">Fonti: API pubbliche <a href="https://github.com/jolpica/jolpica-f1" target="_blank" rel="noopener">Jolpica-F1</a> e, in alternativa, <a href="https://f1api.dev" target="_blank" rel="noopener">f1api.dev</a> (scegli la fonte qui sotto, in "Scarica anno per anno"). Riferimento: <a href="https://www.formula1.com/en/results" target="_blank" rel="noopener">formula1.com/en/results</a>, che non può essere letto direttamente da una web app.</p>
   <div id="syncwrap">${Sync.running || Sync.err || Sync.msg ? syncBox() + (Sync.err ? `<p style="color:#f5a623">Errore: ${esc(Sync.err)}</p>` : '') : ''}</div>
   <div class="row"><button class="btn pri" id="bUpd">Aggiorna ora</button><button class="btn" id="bFull">Riscarica tutto</button>
   <label><input type="checkbox" id="auto" ${SET.auto ? 'checked' : ''}> Aggiorna automaticamente all'apertura</label></div></div>
  <div class="card"><h2 style="margin-top:0">Scarica anno per anno</h2>
   <div class="row" style="margin-bottom:8px"><label>Fonte dei dati <select id="srcSel"><option value="jolpica">Jolpica-F1 (consigliata)</option><option value="f1api" ${SET.src === 'f1api' ? 'selected' : ''}>f1api.dev (alternativa)</option></select></label></div>
   <p class="small">Tocca una stagione per scaricarla (o riscaricarla) dalla fonte scelta: risultati, sprint, qualifiche e classifiche. Puoi toccarne più di una: vengono messe in coda.</p>
   <p class="small mut" id="srcNote">${srcNote()}</p>
   <div class="row" style="margin-bottom:10px"><label>Dal <select id="rgFrom">${yearOpts(1950)}</select></label><label>al <select id="rgTo">${yearOpts(CUR_YEAR)}</select></label>
   <button class="btn" id="bRange">Scarica intervallo</button><button class="btn" id="bMissing">Scarica solo le mancanti</button></div>
   <div class="ylegend small mut"><span class="ys ok">✓</span> completa <span class="ys partial">~</span> parziale <span class="ys missing">·</span> da scaricare <span class="ys queued">…</span> in coda</div>
   <div class="ygrid" id="ygrid">${yearGrid()}</div>
   <div class="small mut" id="qinfo" style="margin-top:6px">${queueInfo()}</div></div>
  <div class="card"><h2 style="margin-top:0">Dati aggiuntivi F1DB</h2>
   <p class="small">Telaio, power unit, gomme, luogo di nascita, giro più veloce prima del 2004 e qualifiche prima del 1994 provengono dal database aperto <b>F1DB</b>. Scarica il file <code>f1db-json-single.zip</code> dall'<a href="https://github.com/f1db/f1db/releases/latest" target="_blank" rel="noopener">ultima release su GitHub</a> e caricalo qui (anche lo ZIP va bene). Ripeti ogni tanto per avere le nuove stagioni.</p>
   <p>${E ? `Importato il ${new Date(E.at).toLocaleString('it-IT')} · ${E.stats.drivers} piloti collegati · ${E.stats.entries} iscrizioni` : '<span class="mut">Non ancora importato.</span>'}</p>
   <div class="row"><input type="file" id="fdb" accept=".zip,.json">${E ? '<button class="btn" id="bDelE">Rimuovi dati F1DB</button>' : ''}<span id="fdbmsg" class="small"></span></div></div>
  <div class="card"><h2 style="margin-top:0">Backup e altri dispositivi</h2>
   <p class="small">Esporta tutti i dati in un file .json per usarli su un altro dispositivo senza riscaricarli. Puoi anche pubblicare il file nel tuo repository GitHub e indicare qui l'indirizzo "raw": l'app lo caricherà al primo avvio e scaricherà dall'API solo le novità.</p>
   <div class="row"><button class="btn" id="bExp">Esporta dati</button><label class="btn">Importa file <input type="file" id="imp" accept=".json" hidden></label><span id="impmsg" class="small"></span></div>
   <div class="row" style="margin-top:10px"><input type="url" id="surl" value="${esc(SET.snapUrl)}" placeholder="https://raw.githubusercontent.com/utente/repo/main/f1-historic.json" style="flex:1;min-width:240px"><button class="btn" id="bSurl">Salva e carica</button></div></div>
  <div class="card"><h2 style="margin-top:0">App</h2><p class="small">${isStandalone() ? 'F1 Historic è installata come app.' : (deferredPrompt ? 'Puoi installare F1 Historic sul dispositivo: si apre a schermo intero e funziona anche offline con i dati già scaricati.' : 'Per installarla: su Android/Chrome usa il menu ⋮ → Installa app; su iPhone/iPad apri la pagina in Safari e scegli Condividi → Aggiungi alla schermata Home.')}</p>${deferredPrompt && !isStandalone() ? '<button class="btn pri" id="bInst">Installa F1 Historic</button>' : ''}<p class="small mut">${navigator.onLine ? 'Online' : 'Offline: vengono mostrati i dati salvati.'} · Versione app ${APP_VERSION}</p></div>
  <div class="card"><h2 style="margin-top:0">Aspetto</h2><div class="row"><label>Tema <select id="theme"><option value="dark">Scuro</option><option value="light" ${SET.theme === 'light' ? 'selected' : ''}>Chiaro</option></select></label></div></div>
  <div class="card"><h2 style="margin-top:0">Ripristino</h2><button class="btn" id="bClr">Cancella tutti i dati salvati</button> <span id="clrmsg" class="small"></span></div>`;
  if ($('#bInst')) $('#bInst').onclick = doInstall;
  $('#srcSel').onchange = e => { SET.src = e.target.value; saveSet(); $('#srcNote').innerHTML = srcNote(); };
  $('#ygrid').onclick = e => { const b = e.target.closest('[data-y]'); if (b) queueYears([+b.dataset.y]); };
  $('#bRange').onclick = () => { let a = +$('#rgFrom').value, b = +$('#rgTo').value; if (a > b) [a, b] = [b, a]; const ys = []; for (let y = b; y >= a; y--) ys.push(y); queueYears(ys); };
  $('#bMissing').onclick = () => { const ys = []; for (let y = CUR_YEAR; y >= FIRST_YEAR; y--) if (yearStatus(y) !== 'ok') ys.push(y); queueYears(ys); };
  $('#bUpd').onclick = () => startSync({ src: SET.src });
  $('#bFull').onclick = () => startSync({ full: true, src: SET.src });
  $('#auto').onchange = e => { SET.auto = e.target.checked; saveSet(); };
  $('#theme').onchange = e => { SET.theme = e.target.value; saveSet(); applyTheme(); };
  $('#fdb').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; $('#fdbmsg').textContent = 'Import in corso…';
    try { const s = await importF1DB(f); rebuild(); $('#fdbmsg').textContent = `Fatto: ${s.drivers} piloti e ${s.entries} iscrizioni collegati.`; setTimeout(() => route(), 1500); }
    catch (err) { $('#fdbmsg').textContent = 'Errore: ' + err.message; }
  };
  if ($('#bDelE')) $('#bDelE').onclick = async () => { D.enrich = null; await Store.del('enrich'); rebuild(); route(); };
  $('#bExp').onclick = () => {
    const blob = new Blob([JSON.stringify(makeSnapshot())], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'f1-historic.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; $('#impmsg').textContent = 'Import in corso…';
    try { await applySnapshot(JSON.parse(await f.text())); rebuild(); $('#impmsg').textContent = 'Dati importati.'; } catch (err) { $('#impmsg').textContent = 'Errore: ' + err.message; }
  };
  $('#bSurl').onclick = async () => { SET.snapUrl = $('#surl').value.trim(); saveSet(); if (SET.snapUrl) { $('#impmsg').textContent = 'Caricamento…'; try { await loadSnapUrl(); $('#impmsg').textContent = 'Dati caricati dall\'indirizzo.'; } catch (err) { $('#impmsg').textContent = 'Errore: ' + err.message; } } };
  let armed = false;
  $('#bClr').onclick = async () => {
    if (!armed) { armed = true; $('#clrmsg').textContent = 'Premi di nuovo per confermare: tutti i dati scaricati verranno eliminati.'; return; }
    Sync.cancel = true; await Store.clear(); Object.assign(D, { seasons: {}, drivers: {}, cons: {}, circuits: {}, enrich: null, meta: { lastSync: 0 } }); rebuild(); $('#clrmsg').textContent = 'Dati eliminati.';
  };
}
// dati incorporati nell'app (data.json accanto a index.html, generato dall'azione GitHub)
async function loadEmbedded() {
  if (location.protocol === 'file:') return false;
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) return false;
    const o = await r.json();
    if (!o || !o.exportedAt || o.exportedAt === D.meta.embedAt) return false;
    await applySnapshot(o);
    D.meta.embedAt = o.exportedAt;
    D.meta.lastSync = Math.max(D.meta.lastSync || 0, Date.parse(o.exportedAt) || 0);
    await Store.set('meta', D.meta);
    return true;
  } catch (e) { return false; }
}
async function loadSnapUrl() {
  const r = await fetch(SET.snapUrl, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
  await applySnapshot(await r.json()); rebuild();
}

// ---------- modale ----------
function showModal(html) { $('#mbox').innerHTML = '<button class="x" aria-label="Chiudi">×</button>' + html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }

// ---------- sincronizzazione ----------
let rebuildT = 0;
function rebuild() { buildModel(); updateChip(); }
function startSync(opts) { if (Sync.running) return; runSync(opts).then(() => { rebuild(); route(); pumpQueue(); }); updateChip(); }
function updateChip() {
  const el = $('#chip'); if (!el) return;
  const pct = Sync.total ? Math.round(Sync.done / Sync.total * 100) : 0;
  if (Sync.running) el.innerHTML = `<span class="dot run"></span><span>${Sync.wait ? 'In pausa (limite API)' : 'Aggiornamento ' + pct + '%'}</span><span class="bar"><i style="width:${pct}%"></i></span>`;
  else if (Sync.err) el.innerHTML = `<span class="dot err"></span><span>Aggiornamento non riuscito</span>`;
  else if (!navigator.onLine) el.innerHTML = `<span class="dot err"></span><span>Offline</span>`;
  else el.innerHTML = `<span class="dot"></span><span>${D.meta.lastSync ? 'Aggiornato ' + new Date(D.meta.lastSync).toLocaleDateString('it-IT') : (Object.keys(D.seasons).length ? Object.values(D.seasons).filter(s => s.done && s.done.res).length + ' stagioni scaricate' : 'Nessun dato')}</span>`;
  refreshYearUI();
  const sb = $('#syncbox'); if (sb) sb.outerHTML = syncBox();
  const sw = $('#syncwrap'); if (sw && !sw.innerHTML && Sync.running) sw.innerHTML = syncBox();
}
Sync.onProgress = updateChip;
Sync.onSeason = () => {
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => {
    const wasEmpty = !M || M.empty; buildModel();
    if (wasEmpty && !M.empty && page !== 'impostazioni') route();
    else if (!M.empty && page !== 'impostazioni') $('#newdata').hidden = false;
  }, 1500);
};
// ---------- PWA ----------
const APP_VERSION = '1.3.0';
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (e) {}
  deferredPrompt = null; $('#installBtn').hidden = true; if (page === 'impostazioni') route();
}
function setupPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!isStandalone()) $('#installBtn').hidden = false; });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; $('#installBtn').hidden = true; });
  $('#installBtn').onclick = doInstall;
  window.addEventListener('online', () => { updateChip(); if (SET.auto && Date.now() - (D.meta.lastSync || 0) > 3 * 3600e3 && Object.keys(D.seasons).length) startSync({ src: SET.src }); });
  window.addEventListener('offline', updateChip);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const okProto = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!('serviceWorker' in navigator) || !okProto) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => { $('#swUpd').hidden = false; $('#swUpd').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 6 * 3600e3);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
function applyTheme() { document.documentElement.dataset.theme = SET.theme; }

// ---------- avvio ----------
async function init() {
  applyTheme();
  setupPWA();
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#${k}" data-p="${k}">${l}</a>`).join('');
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('.modal .x') || t.id === 'modal') return closeModal();
    const a = t.closest('[data-d],[data-c],[data-race]');
    if (a) {
      e.preventDefault();
      if (a.dataset.race) return openRace(a.dataset.race, a.dataset.tab);
      if (a.dataset.d) return profile('d', a.dataset.d);
      if (a.dataset.c) return profile('c', a.dataset.c);
    }
    if (t.id === 'startSync') { startSync({ src: SET.src }); route(); }
    if (t.id === 'stopSync') Sync.cancel = true;
    if (t.closest('#menubtn')) $('nav.menu').classList.toggle('open');
    if (t.closest('#chip')) go('impostazioni');
    if (t.id === 'newdata') { $('#newdata').hidden = true; route(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', route);
  const ok = await Store.open();
  if (!ok) $('#main').insertAdjacentHTML('beforebegin', '<div class="banner" style="margin:10px">Questo browser non permette di salvare i dati (IndexedDB non disponibile): verranno riscaricati a ogni apertura.</div>');
  await loadAll();
  const hadData = Object.keys(D.seasons).length > 0;
  if (!hadData) {
    $('#main').innerHTML = '<h1>F1 Historic</h1><p class="mut">Caricamento dei dati incorporati…</p>';
    await loadEmbedded();
    if (SET.snapUrl && !Object.keys(D.seasons).length) { try { await loadSnapUrl(); } catch (e) {} }
  }
  buildModel(); updateChip(); route();
  if (hadData && await loadEmbedded()) { buildModel(); updateChip(); if (['impostazioni', 'whatif'].includes(page)) route(); else $('#newdata').hidden = false; }
  const stale = Date.now() - (D.meta.lastSync || 0) > 3 * 3600e3;
  if (SET.auto && navigator.onLine && Object.keys(D.seasons).length && stale) startSync({ src: SET.src });
}
init();

}

</script>
</body>
</html>
